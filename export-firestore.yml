name: Export Firestore to JSON

on:
  schedule:
    - cron: "*/10 * * * *"   # 약 10분마다 (GitHub 사정에 따라 몇 분 지연될 수 있음)
  workflow_dispatch:
    inputs:
      full:
        description: "전체 재동기화 (삭제 반영 등 즉시 전체를 다시 받고 싶을 때)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: export-firestore
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firestore -> JSON
        env:
          DATA_DIR: data          # index7.html 과 같은 폴더 아래의 data 폴더
          CONFIG_JS: config.js    # firebaseConfig 가 들어 있는 파일 (시크릿을 따로 안 만들어도 여기서 읽음)
          FULL_SYNC: ${{ inputs.full && '1' || '0' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_REFERER: ${{ secrets.FIREBASE_REFERER }}
        run: node scripts/export-firestore.mjs

      - name: 변경이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: update Firestore snapshot"
          git pull --rebase --autostash
          git push

const WEEKDAYS_KR = ['일','월','화','수','목','금','토'];

function formatDateMDShort(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const wd = WEEKDAYS_KR[d.getDay()];
  return `${mm}-${dd}(${wd})`;
}

function getVisualWidth(str) {
  let width = 0;
  for (const ch of String(str)) {
    const code = ch.codePointAt(0);
    const isWide = (
      (code >= 0x1100 && code <= 0x115F) ||
      (code >= 0x2E80 && code <= 0xA4CF) ||
      (code >= 0xAC00 && code <= 0xD7A3) ||
      (code >= 0xF900 && code <= 0xFAFF) ||
      (code >= 0xFF00 && code <= 0xFF60) ||
      (code >= 0xFFE0 && code <= 0xFFE6)
    );
    width += isWide ? 2 : 1;
  }
  return width;
}

function formatGroupNames(namesArray, maxCharsPerLine = 40) {
  if (!namesArray || namesArray.length === 0) return "";
  const lines = [];
  let current = "";
  namesArray.forEach(name => {
    const candidate = current ? current + ", " + name : name;
    if (current && getVisualWidth(candidate) > maxCharsPerLine) {
      lines.push(current);
      current = name;
    } else {
      current = candidate;
    }
  });
  if (current) lines.push(current);
  return lines.join("\n");
}

// 엑셀/이미지 통계가 공유하는 데이터 집계 로직
function computeMonthlyGroupData(year, month){
  return new Promise((resolve, reject) => {
    if(!db){ reject(new Error("데이터베이스 연결이 없습니다.")); return; }

    const mm = String(month).padStart(2, '0');
    const lastDay = new Date(year, month, 0).getDate();

    const today = new Date();
    const todayStr = `${today.getMonth() + 1}/${today.getDate()}`;
    const titleText = `${year}년 ${month}월 (${todayStr} 기준)`;

    db.collection("schedules").get().then((querySnapshot) => {
      let outGroups = {};

      querySnapshot.forEach(doc => {
        const regDate = doc.id;
        const data = doc.data();
        if(!data.teams || data.teams.length === 0) return;

        data.teams.forEach(t => {
          const name = t.name || "";
          const defaultNights = getDefaultNightsByDate(regDate);
          const nights = parseInt(t.nights || defaultNights, 10);
          const pattern = normalizePattern(t.pattern);
          const returnDate = getReturnDate(regDate, nights);

          let outP = parseInt(t.totalPeople || 0, 10);
          let inP = parseInt(t.totalPeople || 0, 10);

          if (t.isSplitRoom) {
            outP = (t.outAllocations || []).reduce((sum, a) => sum + (parseInt(a.people, 10) || 0), 0);
            inP = (t.inAllocations || []).reduce((sum, a) => sum + (parseInt(a.people, 10) || 0), 0);
          }

          if(pattern === 'ROUND'){
            if(!outGroups[regDate]) outGroups[regDate] = { names: [], total: 0 };
            outGroups[regDate].names.push(`${name} ${outP}명`);
            outGroups[regDate].total += outP;

            if(!outGroups[returnDate]) outGroups[returnDate] = { names: [], total: 0 };
            outGroups[returnDate].names.push(`${name} ${inP}명`);
            outGroups[returnDate].total += inP;

          } else if(pattern === 'ONEWAY_OUT' || pattern === 'ONEWAY_IN'){
            if(!outGroups[regDate]) outGroups[regDate] = { names: [], total: 0 };
            outGroups[regDate].names.push(`${name} ${outP}명`);
            outGroups[regDate].total += outP;
          }
        });
      });

      let leftDates = [];
      let rightDates = [];

      for (let day = 1; day <= lastDay; day++) {
        const curDateStr = `${year}-${mm}-${String(day).padStart(2, '0')}`;
        const dow = new Date(curDateStr).getDay();

        if (dow === 1 || dow === 3 || dow === 5) {
          leftDates.push(curDateStr);
        } else if (dow === 2 || dow === 4 || dow === 0) {
          rightDates.push(curDateStr);
        }
      }

      const maxRows = Math.max(leftDates.length, rightDates.length);

      resolve({ year, month, mm, titleText, leftDates, rightDates, outGroups, maxRows });
    }).catch(reject);
  });
}

// "📗 통계 정리용" 전용 데이터 계산
// computeMonthlyGroupData와 달리 왕복(ROUND) 단체의 "복귀(리턴)" 구간은 제외하고,
// 실제 그 날짜에 "출발"하는 단체만 모은다.
function computeDepartureOnlyData(year, month){
  return new Promise((resolve, reject) => {
    if(!db){ reject(new Error("데이터베이스 연결이 없습니다.")); return; }

    const mm = String(month).padStart(2, '0');
    const lastDay = new Date(year, month, 0).getDate();

    const today = new Date();
    const todayStr = `${today.getMonth() + 1}/${today.getDate()}`;
    const titleText = `${year}년 ${month}월 (${todayStr} 기준)`;

    db.collection("schedules").get().then((querySnapshot) => {
      let departureGroups = {}; // 날짜 -> [{name, count}, ...] (리턴 단체 제외)

      querySnapshot.forEach(doc => {
        const regDate = doc.id;
        const data = doc.data();
        if(!data.teams || data.teams.length === 0) return;

        data.teams.forEach(t => {
          const name = t.name || "";
          const pattern = normalizePattern(t.pattern);

          let outP = parseInt(t.totalPeople || 0, 10);
          if (t.isSplitRoom) {
            outP = (t.outAllocations || []).reduce((sum, a) => sum + (parseInt(a.people, 10) || 0), 0);
          }

          // ROUND든 ONEWAY든, 그 팀이 실제로 "출발"하는 날은 regDate 뿐 (복귀 구간은 제외)
          if (pattern === 'ROUND' || pattern === 'ONEWAY_OUT' || pattern === 'ONEWAY_IN') {
            if (!departureGroups[regDate]) departureGroups[regDate] = [];
            departureGroups[regDate].push({ name, count: outP });
          }
        });
      });

      let leftDates = [];
      let rightDates = [];

      for (let day = 1; day <= lastDay; day++) {
        const curDateStr = `${year}-${mm}-${String(day).padStart(2, '0')}`;
        const dow = new Date(curDateStr).getDay();

        if (dow === 1 || dow === 3 || dow === 5) {
          leftDates.push(curDateStr);
        } else if (dow === 2 || dow === 4 || dow === 0) {
          rightDates.push(curDateStr);
        }
      }

      resolve({ year, month, mm, titleText, leftDates, rightDates, departureGroups });
    }).catch(reject);
  });
}

// [엑셀 다운로드] computeMonthlyGroupData 결과로 xlsx 파일 생성
// options.fileNameOverride / options.sheetNameOverride 로 '통계 정리용' 등 동일한 형식의 별도 파일을 만들 수 있음
function buildExcelFromData(data, options){
  options = options || {};
  const { year, mm, titleText, leftDates, rightDates, outGroups, maxRows } = data;

  {
    const borderAll = {
      top: { style: "thin", color: { rgb: "000000" } },
      bottom: { style: "thin", color: { rgb: "000000" } },
      left: { style: "thin", color: { rgb: "000000" } },
      right: { style: "thin", color: { rgb: "000000" } }
    };

    const centerStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center", wrapText: true } };
    const leftStyle = { border: borderAll, alignment: { horizontal: "left", vertical: "center", wrapText: true } };
    const titleStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true, sz: 16 }, fill: { fgColor: { rgb: "E2EFDA" } } };
    const headerStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true }, fill: { fgColor: { rgb: "F2F2F2" } } };
    const totalStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true }, fill: { fgColor: { rgb: "FFF2CC" } } };
    const noteStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true, color: { rgb: "D32F2F" }, sz: 11 } };

    const aoa = [];
    aoa.push([`${titleText} 단체 운항 현황`, "", "", "", "", ""]);
    aoa.push(["날짜", "OUT", "총인원", "날짜", "IN", "총인원"]);

    const rowLineCounts = [1, 1];
    let outSum = 0;
    let inSum = 0;

    for (let i = 0; i < maxRows; i++) {
      const lDate = leftDates[i] || "";
      const rDate = rightDates[i] || "";

      const lDateDisp = lDate ? formatDateMDShort(lDate) : "";
      const lNamesDisp = (lDate && outGroups[lDate]) ? formatGroupNames(outGroups[lDate].names) : "";
      const lTotalDisp = (lDate && outGroups[lDate]) ? outGroups[lDate].total : "";

      const rDateDisp = rDate ? formatDateMDShort(rDate) : "";
      const rNamesDisp = (rDate && outGroups[rDate]) ? formatGroupNames(outGroups[rDate].names) : "";
      const rTotalDisp = (rDate && outGroups[rDate]) ? outGroups[rDate].total : "";

      aoa.push([lDateDisp, lNamesDisp, lTotalDisp, rDateDisp, rNamesDisp, rTotalDisp]);

      if (lTotalDisp !== "") outSum += lTotalDisp;
      if (rTotalDisp !== "") inSum += rTotalDisp;

      const countWrappedLines = (text) => {
        if (!text) return 1;
        return text.split("\n").reduce((sum, line) => sum + Math.max(1, Math.ceil(getVisualWidth(line) / 40)), 0);
      };
      const lLines = countWrappedLines(lNamesDisp);
      const rLines = countWrappedLines(rNamesDisp);
      rowLineCounts.push(Math.max(lLines, rLines, 1));
    }

    const totalRowIdx = 2 + maxRows;
    aoa.push(["", "총 합계", outSum, "", "총 합계", inSum]);
    rowLineCounts.push(1);

    const noteRowIdx = 3 + maxRows;
    aoa.push(["* 위 예약상황은 모객 중이므로 인원이 많이 변동될 수 있습니다.", "", "", "", "", ""]);
    rowLineCounts.push(1);

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    ws['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
      { s: { r: noteRowIdx, c: 0 }, e: { r: noteRowIdx, c: 5 } }
    ];

    ws['!cols'] = [
      { wch: 13 }, { wch: 45 }, { wch: 10 },
      { wch: 13 }, { wch: 45 }, { wch: 10 }
    ];

    ws['!rows'] = rowLineCounts.map(lines => ({ hpx: Math.max(22, lines * 18) }));

    for (let r = 0; r < aoa.length; r++) {
      for (let c = 0; c < 6; c++) {
        const addr = XLSX.utils.encode_cell({ r, c });
        if (!ws[addr]) ws[addr] = { t: "s", v: "" };

        if (r === 0) {
          ws[addr].s = titleStyle;
        } else if (r === 1) {
          ws[addr].s = headerStyle;
        } else if (r === totalRowIdx) {
          ws[addr].s = totalStyle;
        } else if (r === noteRowIdx) {
          ws[addr].s = noteStyle;
        } else {
          ws[addr].s = (c === 1 || c === 4) ? leftStyle : centerStyle;
        }
      }
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, options.sheetNameOverride || "월별단체현황");

    XLSX.writeFile(wb, options.fileNameOverride || `단동훼리_${year}년${mm}월_단체운항현황.xlsx`);
  }
}

// 엑셀 통계 버튼 → 데이터 조회 후 엑셀 다운로드까지 한번에 실행 (기존 동작 유지용)

const WEEKDAYS_ZH = ['周日','周一','周二','周三','周四','周五','周六'];
function formatDateMDShortZh(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}-${d.getDate()}(${WEEKDAYS_ZH[d.getDay()]})`;

function buildStatsTableHtml(data, lang){

    titleText = `${data.year}年${data.month}月 (截至${_t.getMonth() + 1}/${_t.getDate()})`;
  }
  const fmtDate = isZh ? formatDateMDShortZh : formatDateMDShort;
  const fmtNames = (names) => formatGroupNames(isZh ? names.map(n => n.replace(/(\d+)명$/, "$1人")) : names);

  let rows = "";
  let outSum = 0;
  let inSum = 0;

  for (let i = 0; i < maxRows; i++) {
    const lDate = leftDates[i] || "";
    const rDate = rightDates[i] || "";

    const lDateDisp = lDate ? fmtDate(lDate) : "";
    const lNamesDisp = (lDate && outGroups[lDate]) ? fmtNames(outGroups[lDate].names) : "";
    const lTotalDisp = (lDate && outGroups[lDate]) ? outGroups[lDate].total : "";

    const rDateDisp = rDate ? fmtDate(rDate) : "";
    const rNamesDisp = (rDate && outGroups[rDate]) ? fmtNames(outGroups[rDate].names) : "";
    const rTotalDisp = (rDate && outGroups[rDate]) ? outGroups[rDate].total : "";

    if (lTotalDisp !== "") outSum += lTotalDisp;
    if (rTotalDisp !== "") inSum += rTotalDisp;

    rows += `<tr>
      <td class="a4-col-date">${esc(lDateDisp)}</td>
      <td class="a4-col-names">${esc(lNamesDisp).replace(/\n/g,"<br>")}</td>
      <td class="a4-col-total">${esc(lTotalDisp === "" ? "" : String(lTotalDisp))}</td>
      <td class="a4-col-date">${esc(rDateDisp)}</td>
      <td class="a4-col-names">${esc(rNamesDisp).replace(/\n/g,"<br>")}</td>
      <td class="a4-col-total">${esc(rTotalDisp === "" ? "" : String(rTotalDisp))}</td>
    </tr>`;
  }

  rows += `<tr style="font-weight:bold; background:#fff2cc;">

    <td class="a4-col-names">${isZh ? "总计" : "총 합계"}</td>

    <td class="a4-col-date"></td>
    <td class="a4-col-names">${isZh ? "总计" : "총 합계"}</td>
    <td class="a4-col-total">${inSum}</td>
  </tr>`;

  return `
    <div class="a4-title">${esc(titleText)} ${isZh ? "团体运营情况" : "단체 운항 현황"}</div>
    <table class="a4-stats-table">
      <colgroup>
        <col style="width:10%"><col style="width:33%"><col style="width:7%">
        <col style="width:10%"><col style="width:33%"><col style="width:7%">
      </colgroup>
      <thead><tr>${isZh ? "<th>日期</th><th>出港 OUT</th><th>总人数</th><th>日期</th><th>入港 IN</th><th>总人数</th>" : "<th>날짜</th><th>OUT</th><th>총인원</th><th>날짜</th><th>IN</th><th>총인원</th>"}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="a4-note">${isZh ? "* 以上预订情况仍在招募中，人数可能会有较大变动。" : "* 위 예약상황은 모객 중이므로 인원이 많이 변동될 수 있습니다."}</div>
  `;
}

// "📗 통계 정리용" 버튼용 엑셀 생성
// 리턴(복귀) 단체는 제외하고, 그 날짜에 실제로 "출발"하는 모든 단체를 포함
// 왼쪽 3열(날짜/여행사명/인원) = 월,수,금 / 오른쪽 3열(날짜/여행사명/인원) = 화,목,일
// 단체 하나당 한 행에 [날짜, 여행사명, 인원]을 가로로 나열
function buildStatsOrganizeExcel(data){
  const { year, mm, titleText, leftDates, rightDates, departureGroups } = data;

  // 날짜 순서대로, 그 날짜에 출발하는 모든 단체를 [날짜, 여행사명, 인원] 한 행씩 나열
  const flattenDepartures = (dates) => {
    const rows = [];
    dates.forEach(d => {
      const teams = departureGroups[d];
      if (teams && teams.length) {
        teams.forEach(team => {
          rows.push([formatDateMDShort(d), team.name, team.count]);
        });
      }
    });
    return rows;
  };

  const leftRows = flattenDepartures(leftDates);
  const rightRows = flattenDepartures(rightDates);
  const maxLen = Math.max(leftRows.length, rightRows.length);

  const aoa = [];
  aoa.push([`${titleText} 통계 정리`, "", "", "", "", ""]);
  aoa.push(["월, 수, 금", "", "", "화, 목, 일", "", ""]);
  aoa.push(["날짜", "여행사명", "인원", "날짜", "여행사명", "인원"]);
  const headerRowCount = 3;
  for (let i = 0; i < maxLen; i++){
    const l = leftRows[i] || ["", "", ""];
    const r = rightRows[i] || ["", "", ""];
    aoa.push([...l, ...r]);
  }

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  const borderAll = {
    top: { style: "thin", color: { rgb: "000000" } },
    bottom: { style: "thin", color: { rgb: "000000" } },
    left: { style: "thin", color: { rgb: "000000" } },
    right: { style: "thin", color: { rgb: "000000" } }
  };
  const titleStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true, sz: 14 }, fill: { fgColor: { rgb: "E2EFDA" } } };
  const sectionStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true }, fill: { fgColor: { rgb: "D9E1F2" } } };
  const headerStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { bold: true }, fill: { fgColor: { rgb: "F2F2F2" } } };
  const dateStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" } };
  const nameStyle = { border: borderAll, alignment: { horizontal: "left", vertical: "center" } };
  const countStyle = { border: borderAll, alignment: { horizontal: "center", vertical: "center" }, font: { color: { rgb: "1769AA" }, bold: true } };

  ws['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 2 } },
    { s: { r: 1, c: 3 }, e: { r: 1, c: 5 } }
  ];
  ws['!cols'] = [{ wch: 12 }, { wch: 24 }, { wch: 8 }, { wch: 12 }, { wch: 24 }, { wch: 8 }];

  for (let r = 0; r < aoa.length; r++){
    for (let c = 0; c < 6; c++){
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { t: "s", v: "" };
      if (r === 0) ws[addr].s = titleStyle;
      else if (r === 1) ws[addr].s = sectionStyle;
      else if (r === 2) ws[addr].s = headerStyle;
      else {
        const colInBlock = c % 3; // 0=날짜, 1=여행사명, 2=인원
        ws[addr].s = colInBlock === 0 ? dateStyle : (colInBlock === 1 ? nameStyle : countStyle);
      }
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "통계정리");
  XLSX.writeFile(wb, `단동훼리_${year}년${mm}월_통계정리.xlsx`);
}

// ============================================================
// [CIQ 제출용] 달력 형태 엑셀 (통계 > CIQ 제출용)
// - 운항일(월/수/금) 칸 하나에 입항/출항 인원을 K(한국)/C(중국) 합산으로 표기
// - 출항(월,수,금 출발): K = 그날 최초 출국 단체 합산 / C = 그날 리턴 단체 합산
// - 입항(화,목,일 출발 → 다음날 월,수,금 칸에 표기): C = 그날 최초 출국 단체 합산 / K = 그날 리턴 단체 합산
// ============================================================
const CIQ_BOLD_THRESHOLD = 400;          // K+C 합계가 이 값 이상이면 굵게 표시 (예시1 기준)
const CIQ_SKIP_DATES = {                 // 운항 없음(SKIP) 처리할 날짜: { "YYYY-MM-DD": "표시할 휴일명" }
  "2026-09-25": "추석"
};

function ciqAddDays(dateStr, n){
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split("T")[0];
}
function ciqDow(dateStr){
  return new Date(dateStr + "T00:00:00Z").getUTCDay();
}
// 한국 공휴일 조회 (캘린더와 동일한 API) -> { "YYYY-MM-DD": "공휴일명" }
async function ciqFetchHolidays(year){
  const map = {};
  try {
    const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const list = await res.json();
    list.forEach(h => {
      const name = h.localName || h.name;
      if(!name) return;
      map[h.date] = map[h.date] ? (map[h.date] + "/" + name) : name;
    });
  } catch(e) { console.warn("공휴일 조회 실패 (CIQ 엑셀에 공휴일 미표시):", e); }
  return map;
}

// 날짜별 '최초 출국 합계'와 '리턴 합계'를 집계
function computeCiqData(year, month){
  return new Promise((resolve, reject) => {
    if(!db){ reject(new Error("데이터베이스 연결이 없습니다.")); return; }

    db.collection("schedules").get().then(querySnapshot => {
      const firstOut = {};  // 날짜 -> 그날 최초 출국(출발) 단체 인원 합
      const retIn = {};     // 날짜 -> 그날 리턴 단체 인원 합 (왕복 단체만)

      querySnapshot.forEach(doc => {
        const regDate = doc.id;
        const data = doc.data();
        if(!data.teams || data.teams.length === 0) return;

        data.teams.forEach(t => {
          const defaultNights = getDefaultNightsByDate(regDate);
          const nights = parseInt(t.nights || defaultNights, 10);
          const pattern = normalizePattern(t.pattern);
          const returnDate = getReturnDate(regDate, nights);

          let outP = parseInt(t.totalPeople || 0, 10) || 0;
          let inP = outP;
          if (t.isSplitRoom) {
            outP = (t.outAllocations || []).reduce((s, a) => s + (parseInt(a.people, 10) || 0), 0);
            inP = (t.inAllocations || []).reduce((s, a) => s + (parseInt(a.people, 10) || 0), 0);
          }

          if (pattern === 'ROUND' || pattern === 'ONEWAY_OUT' || pattern === 'ONEWAY_IN') {
            firstOut[regDate] = (firstOut[regDate] || 0) + outP;
          }
          if (pattern === 'ROUND') {
            retIn[returnDate] = (retIn[returnDate] || 0) + inP;
          }
        });
      });

      const mm = String(month).padStart(2, '0');
      const lastDay = new Date(year, month, 0).getDate();
      const days = {};   // 운항일(월,수,금) -> { inK, inC, outK, outC }
      for (let day = 1; day <= lastDay; day++) {
        const d = `${year}-${mm}-${String(day).padStart(2, '0')}`;
        const dow = ciqDow(d);
        if (dow !== 1 && dow !== 3 && dow !== 5) continue;
        const prev = ciqAddDays(d, -1);   // 전날(일,화,목) 출발 → 오늘 입항
        days[d] = {
          inK: retIn[prev] || 0,
          inC: firstOut[prev] || 0,
          outK: firstOut[d] || 0,
          outC: retIn[d] || 0
        };
      }
      ciqFetchHolidays(year).then(holidays => resolve({ year, month, mm, lastDay, days, holidays }));
    }).catch(reject);
  });
}

function buildCiqExcel(data){
  const { year, month, mm, lastDay, days } = data;
  const holidays = data.holidays || {};

  const FONT = "맑은 고딕";
  const BLUE = "0000FF", RED = "FF0000", BLACK = "000000";
  const line = (s) => s ? { style: s, color: { rgb: "000000" } } : undefined;

  // 요일 칸(2열)의 바깥 테두리만 그리기 (칸 내부 선 없음)
  const dayBorder = (r, c) => ({
    top: line(r === 0 ? "dotted" : null),
    bottom: line(r === 2 ? "dotted" : null),
    left: line(c === 0 ? "dotted" : null),
    right: line(c === 1 ? "dotted" : null)
  });
  const thin = { top: line("thin"), bottom: line("thin"), left: line("thin"), right: line("thin") };

  const COLS = 14; // 요일 7 × 2열
  const aoa = [];
  const styles = {}; // "r,c" -> style
  const setS = (r, c, v, s) => { aoa[r] = aoa[r] || new Array(COLS).fill(""); aoa[r][c] = v; styles[r + "," + c] = s; };

  // 1행: 제목
  aoa.push(new Array(COLS).fill(""));
  for (let c = 0; c < COLS; c++) setS(0, c, c === 0 ? `단동 ${year}년 ${month}월 단체 예정표` : "",
    { font: { name: FONT, bold: true, sz: 26 }, alignment: { horizontal: "center", vertical: "center" } });

  // 2행: 요일 헤더
  const dowNames = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
  const dowFill = ["FFDDE4","F2F2F2","F2F2F2","F2F2F2","F2F2F2","F2F2F2","D9E1F2"];
  aoa.push(new Array(COLS).fill(""));
  for (let i = 0; i < 7; i++) for (let k = 0; k < 2; k++)
    setS(1, i * 2 + k, k === 0 ? dowNames[i] : "", {
      font: { name: FONT, bold: true, sz: 12, color: { rgb: BLACK } },
      fill: { patternType: "solid", fgColor: { rgb: dowFill[i] } },
      alignment: { horizontal: "center", vertical: "center" }, border: thin
    });

  // 주 단위 (일요일 시작)
  const firstDow = ciqDow(`${year}-${mm}-01`);
  const totalCells = firstDow + lastDay;
  const weeks = Math.ceil(totalCells / 7);
  const merges = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: COLS - 1 } }
  ];
  for (let i = 0; i < 7; i++) merges.push({ s: { r: 1, c: i * 2 }, e: { r: 1, c: i * 2 + 1 } });

  const heights = [{ hpx: 52 }, { hpx: 26 }];

  for (let w = 0; w < weeks; w++) {
    const base = 2 + w * 3;
    heights.push({ hpx: 22 }, { hpx: 34 }, { hpx: 34 });

    for (let i = 0; i < 7; i++) {
      const dayNum = w * 7 + i - firstDow + 1;
      const c0 = i * 2;
      merges.push({ s: { r: base, c: c0 }, e: { r: base, c: c0 + 1 } });

      // 빈 칸(해당 월이 아닌 날짜)
      if (dayNum < 1 || dayNum > lastDay) {
        for (let rr = 0; rr < 3; rr++) for (let cc = 0; cc < 2; cc++)
          setS(base + rr, c0 + cc, "", { font: { name: FONT, sz: 11 }, border: dayBorder(rr, cc) });
        continue;
      }

      const dateStr = `${year}-${mm}-${String(dayNum).padStart(2, '0')}`;
      const skipName = CIQ_SKIP_DATES[dateStr];
      const holName = holidays[dateStr];
      const dateColor = (skipName || holName || i === 0) ? RED : (i === 6 ? BLUE : BLACK);
      const dateLabel = skipName ? `${dayNum} ${skipName}` : (holName ? `${dayNum} ${holName}` : String(dayNum));

      setS(base, c0, dateLabel, { font: { name: FONT, bold: true, sz: 14, color: { rgb: dateColor } },
        alignment: { horizontal: "left", vertical: "top" }, border: dayBorder(0, 0) });
      setS(base, c0 + 1, "", { font: { name: FONT, sz: 10 }, border: dayBorder(0, 1) });

      const info = days[dateStr]; // 운항일(월,수,금)만 존재
      const rowsDef = [["입항", "inK", "inC"], ["출항", "outK", "outC"]];

      rowsDef.forEach((def, idx) => {
        const r = base + 1 + idx;
        const label = def[0];
        const baseAlign = { horizontal: "left", vertical: "center" };

        if (!info) { // 운항 없는 요일
          setS(r, c0, "", { font: { name: FONT, sz: 11 }, border: dayBorder(idx + 1, 0) });
          setS(r, c0 + 1, "", { font: { name: FONT, sz: 11 }, border: dayBorder(idx + 1, 1) });
          return;
        }
        if (skipName) {
          setS(r, c0, `${label}: SKIP`, { font: { name: FONT, bold: true, sz: 11, color: { rgb: RED } }, alignment: baseAlign, border: dayBorder(idx + 1, 0) });
          setS(r, c0 + 1, "", { font: { name: FONT, sz: 11 }, border: dayBorder(idx + 1, 1) });
          return;
        }

        const k = info[def[1]], c = info[def[2]];
        const bold = true;

        if (k > 0 && c > 0) {
          setS(r, c0, `${label}: K-${k},`, { font: { name: FONT, sz: 11, bold, color: { rgb: BLUE } }, alignment: baseAlign, border: dayBorder(idx + 1, 0) });
          setS(r, c0 + 1, `C-${c}`, { font: { name: FONT, sz: 11, bold, color: { rgb: RED } }, alignment: baseAlign, border: dayBorder(idx + 1, 1) });
        } else if (k > 0) {
          setS(r, c0, `${label}: K-${k}`, { font: { name: FONT, sz: 11, bold, color: { rgb: BLUE } }, alignment: baseAlign, border: dayBorder(idx + 1, 0) });
          setS(r, c0 + 1, "", { font: { name: FONT, sz: 11 }, border: dayBorder(idx + 1, 1) });
        } else if (c > 0) {
          setS(r, c0, `${label}: C-${c}`, { font: { name: FONT, sz: 11, bold, color: { rgb: RED } }, alignment: baseAlign, border: dayBorder(idx + 1, 0) });
          setS(r, c0 + 1, "", { font: { name: FONT, sz: 11 }, border: dayBorder(idx + 1, 1) });
        } else {
          setS(r, c0, `${label}:`, { font: { name: FONT, bold: true, sz: 11, color: { rgb: BLACK } }, alignment: baseAlign, border: dayBorder(idx + 1, 0) });
          setS(r, c0 + 1, "", { font: { name: FONT, sz: 11 }, border: dayBorder(idx + 1, 1) });
        }
      });
    }
  }

  // 마지막 행: 안내 문구
  const noteRow = 2 + weeks * 3;
  aoa[noteRow] = new Array(COLS).fill("");
  for (let c = 0; c < COLS; c++) setS(noteRow, c, c === 0 ? "위 예약 상황은 모객 중이므로 인원이 많이 변동될 수 있습니다." : "",
    { font: { name: FONT, sz: 14 }, alignment: { horizontal: "center", vertical: "center" } });
  merges.push({ s: { r: noteRow, c: 0 }, e: { r: noteRow, c: COLS - 1 } });
  heights.push({ hpx: 30 });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let r = 0; r < aoa.length; r++) {
    for (let c = 0; c < COLS; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { t: "s", v: "" };
      if (styles[r + "," + c]) ws[addr].s = styles[r + "," + c];
    }
  }
  ws['!merges'] = merges;
  ws['!cols'] = Array.from({ length: COLS }, (_, i) => ({ wch: i % 2 === 0 ? 13 : 8 }));
  ws['!rows'] = heights;
  ws['!pageSetup'] = { orientation: "landscape", paperSize: 9 };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "CIQ 제출용");
  XLSX.writeFile(wb, `단동_${year}년${mm}월_CIQ제출용.xlsx`);
}

// "CIQ 제출용" 버튼 → 드롭다운 닫고 현재 보고 있는 달 기준으로 달력형 엑셀 다운로드
function triggerCiqExcelDownload(){
  const dropdown = document.getElementById("statsDropdown");
  if (dropdown) dropdown.classList.remove("show");

  if(!db){ alert("데이터베이스 연결이 없습니다."); return; }

  const currentDate = calendar ? calendar.view.currentStart : new Date();
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth() + 1;

  computeCiqData(year, month).then(data => {

  }).catch(e => {

    alert("다운로드 중 오류가 발생했습니다: " + (e && e.message ? e.message : e));

function downloadResultImage(){
  const area = document.getElementById("captureArea");
  html2canvas(area, { scale: 2, backgroundColor: "#f4f6f9" }).then(canvas => {
    const link = document.createElement("a");
    link.download = `단동훼리_객실배정_${selectedDate}.png`;
    link.href = canvas.toDataURL("image/png");

}

// 최상단 이동 버튼: 70% 이상 스크롤 시 표시 / 드래그로 위치 이동
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('backToTopBtn');
  if (!btn) return;

  function updateVisibility() {
    const doc = document.documentElement;
    const scrollable = doc.scrollHeight - window.innerHeight;
    const ratio = scrollable > 0 ? (window.pageYOffset || doc.scrollTop) / scrollable : 0;
    btn.classList.toggle('show', scrollable > 0 && ratio >= 0.5);
  }
  window.addEventListener('scroll', updateVisibility, { passive: true });
  window.addEventListener('resize', updateVisibility);
  updateVisibility();

  function applyPos(left, top) {
    const maxL = window.innerWidth - btn.offsetWidth;
    const maxT = window.innerHeight - btn.offsetHeight;
    btn.style.left = Math.min(Math.max(0, left), maxL) + 'px';
    btn.style.top = Math.min(Math.max(0, top), maxT) + 'px';
    btn.style.right = 'auto';
    btn.style.bottom = 'auto';
  }
  try {
    const saved = JSON.parse(localStorage.getItem('backToTopPos') || 'null');
    if (saved) applyPos(saved.left, saved.top);
  } catch (e) {}

  let dragging = false, moved = false, startX = 0, startY = 0, baseL = 0, baseT = 0;
  btn.addEventListener('pointerdown', function(e) {
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    const r = btn.getBoundingClientRect();
    baseL = r.left; baseT = r.top;
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
  });
  btn.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    moved = true;
    applyPos(baseL + dx, baseT + dy);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { btn.releasePointerCapture(e.pointerId); } catch (err) {}
    if (moved) {
      const r = btn.getBoundingClientRect();
      try { localStorage.setItem('backToTopPos', JSON.stringify({ left: r.left, top: r.top })); } catch (err) {}
    } else if (e.type === 'pointerup') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
  btn.addEventListener('pointerup', endDrag);
  btn.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', function() {
    if (btn.style.left) { const r = btn.getBoundingClientRect(); applyPos(r.left, r.top); }
  });
});
</script>
<script>
/* ===== 메모 전달 (Firestore: transferMemos 컬렉션) ===== */
const TM_COL = "transferMemos";
let tmAllMemos = [];
let tmViewId = null;

function tmEsc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function tmFmt(y, m, d) {
  return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function tmToday() {
  const d = new Date();
  return tmFmt(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function tmAddDays(str, n) {
  const p = str.split("-").map(Number);
  const dt = new Date(p[0], p[1] - 1, p[2] + n);
  return tmFmt(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
}
/* 표시 조건: 본인 확인 전 + 공지 시작일 ~ 종료일(포함) */
function tmIsActive(m) {
  if (!m || m.confirmed) return false;
  const t = tmToday();
  if (m.startDate && m.startDate > t) return false;
  if (m.endDate && m.endDate < t) return false;
  return true;
}

/* ---- 달력 제목 오른쪽 버튼 영역 ---- */
function tmEnsureBar() {
  const cal = document.getElementById("calendar");
  if (!cal) return null;
  const title = cal.querySelector(".fc-header-toolbar .fc-toolbar-title");
  if (!title) return null;
  const chunk = title.parentElement;
  let bar = document.getElementById("tmBar");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "tmBar";
    bar.className = "tm-bar";
  }
  if (bar.parentElement !== chunk || bar.previousElementSibling !== title) {
    chunk.classList.add("tm-chunk");
    title.insertAdjacentElement("afterend", bar);
  }
  return bar;
}

function tmRender() {
  const bar = tmEnsureBar();
  if (!bar) return;
  const list = tmAllMemos.filter(tmIsActive).sort(function(a, b) { return (a.createdMs || 0) - (b.createdMs || 0); });
  const sig = list.map(function(m) { return m.id + "|" + m.title; }).join("¦");
  if (bar.dataset.sig === sig && bar.childElementCount === list.length) return;
  bar.dataset.sig = sig;
  bar.innerHTML = "";
  list.forEach(function(m) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tm-btn";
    b.textContent = m.title;
    b.addEventListener("click", function(e) { e.stopPropagation(); tmOpenView(m.id); });
    bar.appendChild(b);
  });
}

/* ---- 열람 모달 ---- */
function tmPostedText(m) {
  const d = m.createdMs ? new Date(m.createdMs) : new Date();
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return tmFmt(d.getFullYear(), d.getMonth() + 1, d.getDate()) + " (" + days[d.getDay()] + ") " +
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function tmOpenView(id) {
  const m = tmAllMemos.find(function(x) { return x.id === id; });
  if (!m) return;
  tmViewId = id;
  document.getElementById("tmViewTitle").textContent = m.title;
  document.getElementById("tmViewPosted").textContent = "게시일: " + tmPostedText(m);
  document.getElementById("tmViewContent").textContent = m.content || "";
  document.getElementById("tmViewPeriod").textContent = "공지 기간: " + (m.startDate || "") + " ~ " + (m.endDate || "");
  tmShowViewMode();
  document.getElementById("tmViewModal").classList.remove("hidden");
}
function tmShowViewMode() {
  document.getElementById("tmPwArea").classList.add("hidden");
  document.getElementById("tmFooterPw").classList.add("hidden");
  document.getElementById("tmFooterView").classList.remove("hidden");
  document.getElementById("tmPwInput").value = "";
  document.getElementById("tmPwErr").textContent = "";
}
/* 닫기: 창만 닫고 메모는 그대로 */
function tmCloseView() {
  document.getElementById("tmViewModal").classList.add("hidden");
  tmViewId = null;
  tmShowViewMode();
}
/* 본인 확인: 비밀번호 사용 시 입력 단계, 미사용 시 즉시 처리 */
function tmStartConfirm() {
  const m = tmAllMemos.find(function(x) { return x.id === tmViewId; });
  if (!m) { tmCloseView(); return; }
  if (m.usePassword) {
    document.getElementById("tmPwArea").classList.remove("hidden");
    document.getElementById("tmFooterView").classList.add("hidden");
    document.getElementById("tmFooterPw").classList.remove("hidden");
    document.getElementById("tmPwErr").textContent = "";
    const inp = document.getElementById("tmPwInput");
    inp.value = "";
    setTimeout(function() { inp.focus(); }, 50);
  } else {
    tmDoConfirm(null);
  }
}
function tmCancelPw() { tmShowViewMode(); }
function tmSubmitPw() {
  tmDoConfirm(document.getElementById("tmPwInput").value);
}
function tmDoConfirm(pw) {
  if (!db) { alert("서버 연결이 되어 있지 않습니다."); return; }
  const id = tmViewId;
  if (!id) return;
  const ref = db.collection(TM_COL).doc(id);
  ref.get().then(function(doc) {
    if (!doc.exists || doc.data().confirmed) {
      alert("이미 본인 확인이 완료되었거나 삭제된 메모입니다.");
      tmCloseView();
      return;
    }
    const d = doc.data();
    if (d.usePassword && String(pw == null ? "" : pw) !== String(d.password || "")) {
      document.getElementById("tmPwErr").textContent = "비밀번호가 올바르지 않습니다.";
      return;
    }
    return ref.update({
      confirmed: true,
      confirmedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() { tmCloseView(); });
  }).catch(function(err) {
    alert("본인 확인 처리 중 오류가 발생했습니다: " + err);
  });
}

/* ---- 관리자 입력 화면 (통계 > 메모 전달) ---- */
function showTransferMemoAdmin() {
  const today = tmToday();
  const html = `
    <div class="tm-form">
      <div>
        <label class="tm-lb">제목 (달력 버튼 이름)</label>
        <input type="text" id="tmInTitle" class="tm-in" placeholder="예: 공차장님 필독" maxlength="40">
      </div>
      <div>
        <label class="tm-lb">내용</label>
        <textarea id="tmInContent" class="tm-in" rows="5" placeholder="전달할 내용을 입력하세요"></textarea>
      </div>
      <div>
        <label class="tm-lb">비밀번호 사용 여부 (본인 확인용)</label>
        <div class="tm-radio-row">
          <label><input type="radio" name="tmInUsePw" value="0" onchange="tmTogglePw()"> 사용 안 함</label>
          <label><input type="radio" name="tmInUsePw" value="1" checked onchange="tmTogglePw()"> 사용</label>
        </div>
      </div>
      <div id="tmInPwWrap">
        <label class="tm-lb">비밀번호 (본인 확인)</label>
        <input type="text" id="tmInPw" class="tm-in" value="1" placeholder="본인 확인 시 입력할 비밀번호" autocomplete="off">
      </div>
      <div class="tm-date-row">
        <div>
          <label class="tm-lb">공지 시작일</label>
          <input type="date" id="tmInStart" class="tm-in" value="${today}">
        </div>
        <div>
          <label class="tm-lb">공지 종료일</label>
          <input type="date" id="tmInEnd" class="tm-in" value="${tmAddDays(today, 6)}">
        </div>
      </div>
      <div class="small">※ 내용 열람은 누구나 가능하며, 비밀번호는 '본인 확인' 시에만 사용됩니다. 본인 확인이 완료되면 해당 메모는 모든 사용자의 달력에서 사라집니다.</div>
      <div class="tm-admin-list">
        <label class="tm-lb">등록된 메모 전달</label>
        <div id="tmAdminList"></div>
      </div>
    </div>
  `;
  openStatsModal("📝 메모 전달", html, `<button type="button" class="primary" onclick="tmSaveMemo()">등록</button>`);
  tmRefreshAdminList();
}
function tmTogglePw() {
  const r = document.querySelector('input[name="tmInUsePw"]:checked');
  const wrap = document.getElementById("tmInPwWrap");
  if (wrap) wrap.classList.toggle("hidden", !(r && r.value === "1"));
}
function tmSaveMemo() {
  if (!db) { alert("서버 연결이 되어 있지 않습니다."); return; }
  const title = document.getElementById("tmInTitle").value.trim();
  const content = document.getElementById("tmInContent").value.trim();
  const usePw = (document.querySelector('input[name="tmInUsePw"]:checked') || {}).value === "1";
  const pw = document.getElementById("tmInPw").value;
  const start = document.getElementById("tmInStart").value;
  const end = document.getElementById("tmInEnd").value;
  if (!title) { alert("제목을 입력해 주세요."); return; }
  if (!content) { alert("내용을 입력해 주세요."); return; }
  if (usePw && !pw.trim()) { alert("비밀번호를 입력해 주세요."); return; }
  if (!start || !end) { alert("공지 시작일과 종료일을 선택해 주세요."); return; }
  if (end < start) { alert("종료일은 시작일 이후여야 합니다."); return; }
  db.collection(TM_COL).add({
    title: title,
    content: content,
    usePassword: usePw,
    password: usePw ? pw.trim() : "",
    startDate: start,
    endDate: end,
    confirmed: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    alert("메모 전달가 등록되었습니다.");
    document.getElementById("tmInTitle").value = "";
    document.getElementById("tmInContent").value = "";
    document.getElementById("tmInPw").value = "1";
    const r1 = document.querySelector('input[name="tmInUsePw"][value="1"]');
    if (r1) r1.checked = true;
    tmTogglePw();
  }).catch(function(err) {
    alert("등록 중 오류가 발생했습니다: " + err);
  });
}
function tmStatusOf(m) {
  const t = tmToday();
  if (m.confirmed) return { txt: "본인 확인 완료", cls: "" };
  if (m.endDate && m.endDate < t) return { txt: "기간 종료", cls: "" };
  if (m.startDate && m.startDate > t) return { txt: "예정", cls: "wait" };
  return { txt: "표시 중", cls: "on" };
}
function tmRefreshAdminList() {
  const box = document.getElementById("tmAdminList");
  if (!box) return;
  const list = tmAllMemos.slice().sort(function(a, b) { return (b.createdMs || 0) - (a.createdMs || 0); });
  if (!list.length) {
    box.innerHTML = '<div class="small" style="padding:6px 0;">등록된 메모 전달가 없습니다.</div>';
    return;
  }
  box.innerHTML = list.map(function(m) {
    const s = tmStatusOf(m);
    return '<div class="tm-admin-item">' +
      '<div class="tm-ai-main"><div class="tm-ai-title">' + tmEsc(m.title) + '</div>' +
      '<div class="tm-ai-sub">' + tmEsc(m.startDate || "") + ' ~ ' + tmEsc(m.endDate || "") + (m.usePassword ? ' · 🔐' : '') + '</div>' +
      '<div class="tm-ai-content">' + tmEsc(m.content || "") + '</div></div>' +
      '<span class="tm-badge ' + s.cls + '">' + s.txt + '</span>' +
      '<button type="button" class="danger" style="padding:4px 8px; font-size:12px;" onclick="tmDeleteMemo(\'' + tmEsc(m.id) + '\')">삭제</button>' +
      '</div>';
  }).join("");
}
function tmDeleteMemo(id) {
  if (!db) return;
  if (!confirm("이 메모 전달를 삭제하시겠습니까?")) return;
  db.collection(TM_COL).doc(id).delete().catch(function(err) {
    alert("삭제 중 오류가 발생했습니다: " + err);
  });
}

/* ---- 초기화: 실시간 구독(본인 확인 즉시 전체 반영) + 날짜 경과 자동 제거 ---- */
document.addEventListener('DOMContentLoaded', function() {
  tmRender();
  const cal = document.getElementById("calendar");
  if (cal && window.MutationObserver) {
    new MutationObserver(function() {
      const bar = document.getElementById("tmBar");
      const title = cal.querySelector(".fc-header-toolbar .fc-toolbar-title");
      if (title && (!bar || bar.previousElementSibling !== title)) tmRender();
    }).observe(cal, { childList: true, subtree: true });
  }
  if (db) {
    db.collection(TM_COL).onSnapshot(function(snap) {
      tmAllMemos = snap.docs.map(function(d) {
        const x = d.data();
        return Object.assign({ id: d.id }, x, {
          createdMs: (x.createdAt && x.createdAt.toMillis) ? x.createdAt.toMillis() : 0
        });
      });
      tmRender();
      tmRefreshAdminList();
    }, function(err) { console.log("메모 전달 로드 오류:", err); });
  }
  setInterval(tmRender, 60000);
});
</script>
<button type="button" id="backToTopBtn" title="최상단으로 (드래그하여 위치 이동)" aria-label="최상단으로">↑</button>
</body>

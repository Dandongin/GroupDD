<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단동 스케줄러</title>

<!-- FullCalendar CDN -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
*{box-sizing:border-box}
/* PC(Windows)에서 국기 이모지가 KR/CN 글자로 보이는 문제 해결: Twemoji 국기 전용 폰트 (국기 문자에만 적용됨) */
@font-face{
  font-family:"Twemoji Country Flags";
  unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E0063,U+E0065,U+E0067,U+E006C,U+E006E,U+E0073-E0074,U+E0077,U+E007F;
  src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/TwemojiCountryFlags.woff2") format("woff2");
  font-display:swap;
}
body{margin:0;font-family:"Twemoji Country Flags",Arial,"Malgun Gothic",sans-serif;background:#f4f6f9;color:#202733}
header{background:#17324d;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{margin:0;font-size:20px}
.wrap{max-width:1100px;margin:20px auto;padding:0 18px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px #0000000d}
#calendar{background:white;padding:20px;border-radius:12px;min-height:500px;touch-action:pan-y;}

/* 오늘 날짜 셀 배경색 변경 */
.fc .fc-day-today {
  background-color: #fff59d !important;
}

.date-title{font-size:20px;font-weight:bold;color:#17324d;margin-bottom:15px;display:flex;align-items:center;gap:10px;}
.team-card{border:1px solid #c3d1e0;background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:16px}
.team-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #e1e7ef;padding-bottom:10px;gap:8px;flex-wrap:wrap;}
h2{font-size:16px;margin:0 0 12px}
label{font-size:12px;color:#5c6673;display:block;margin-bottom:4px}
input,select,button,textarea{font:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:7px;background:white}

/* 배정 인원, 박수, 객실 종류 스타일 */
input.assignPeople, input.teamNights, input.teamName, select.typeSelect {
  background:#e3f2fd !important; 
  border:1px solid #90caf9 !important; 
  font-weight:bold; 
  color:#0d47a1;
}

button{border:0;border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff}
.secondary{background:#e9eef4;color:#263746}
.success{background:#2e7d32;color:#fff}
.danger{background:#fff0f0;color:#b3261e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:0;background:#f3f6f9;}.stat b{display:block;font-size:22px;margin-top:5px}
.small{font-size:11px;color:#687583}
.hidden{display:none!important}
.warn-box{padding:10px 12px;background:#fff0f0;border:1px solid #f3c2c2;border-radius:8px;font-size:13px;margin-top:12px}

.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
th,td{padding:9px;border-bottom:1px solid #e4e8ed;text-align:left}
th{background:#f1f4f7}
.bad{color:#b3261e;font-weight:700}
.type-card{border:1px solid #dde3ea;border-radius:8px;padding:10px;margin-bottom:8px;background:white}
.type-grid{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 1.5fr 40px;gap:8px;align-items:center}
.master-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:10px;background:#f0f4f8;padding:12px;border-radius:8px;}
.master-card{background:white;padding:10px;border-radius:8px;border:1px solid #dcdfe6;}
.memo-box{
  border:2px solid #fbc02d;
  border-left:6px solid #e64a19;
  padding:10px 14px;
  border-radius:6px;
  margin-top:8px;
  font-size:14px;
  font-weight:700;
  color:#5d3a00;
  box-shadow:0 0 6px rgba(255,193,7,0.6);
  animation: memoSparkle 1.6s ease-in-out infinite;
}
.memo-box b{color:#d32f2f; font-size:14px;}
@keyframes memoSparkle{
  0%,100%{ box-shadow:0 0 4px 0 rgba(255,193,7,0.45); }
  50%{ box-shadow:0 0 4px 1px rgba(255,193,7,0.95); }
}
.tag-pattern{background:#e3f2fd; color:#0d47a1; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}
.tag-linked{background:#e8f5e9; color:#2e7d32; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}
.tag-riding{background:#fff3e0; color:#e65100; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}
.tag-lounge{background:#fce4ec; color:#ad1457; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}

.section-subtitle{font-size:13px; font-weight:bold; color:#1769aa; margin:8px 0 4px 0; border-left:3px solid #1769aa; padding-left:6px;}

/* 국기 선택 버튼 */
.flag-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
.flag-option{display:flex; align-items:center; gap:6px; padding:8px 12px; border:2px solid #dde3ea; border-radius:8px; background:#fff; cursor:pointer; font-size:13px; font-weight:600; color:#374151;}
.flag-option .flag-emoji{font-size:16px; line-height:1;}
.flag-option:hover{border-color:#90caf9;}
.flag-option.selected{border-color:#1769aa; background:#e3f2fd; color:#0d47a1;}

/* 색상 스와치 선택 */
.color-picker-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:8px; margin-top:4px;}
.color-swatch{display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px 6px; border:2px solid transparent; border-radius:8px; cursor:pointer; background:#fff;}
.color-swatch:hover{background:#f4f6f9;}
.color-swatch.selected{border-color:#1769aa; background:#e8f0fb;}
.color-swatch .swatch-chip{width:28px; height:28px; border-radius:50%; border:1px solid #00000022; box-shadow:inset 0 0 0 2px #ffffff55;}
.color-swatch .swatch-check{position:relative; top:-38px; left:9px; font-size:13px; font-weight:900; color:#fff; text-shadow:0 0 2px #000, 0 0 2px #000; height:0; display:none;}
.color-swatch.selected .swatch-check{display:block;}
.color-swatch .swatch-label{font-size:10.5px; color:#5c6673; text-align:center; line-height:1.2;}

.fc .fc-day-sat a { color: #0000ff !important; }
.fc .fc-day-sun a { color: #d32f2f !important; }
.fc .kr-holiday .fc-daygrid-day-number { color: #d32f2f !important; }
  
.fc-daygrid-day-frame { position: relative; }
.lounge-emoji-badge {
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 13px;
  line-height: 1;
  pointer-events: none;
  z-index: 5;
}

/* 식당 왕복 스티커: 별도 줄을 쓰지 않고 날짜칸 왼쪽 위(🎤 바로 밑)에 겹쳐 표시 */
.restaurant-badge{position:absolute; left:4px; top:2px; font-size:15px; line-height:1; pointer-events:none; z-index:6;}
.restaurant-badge.under-mic{top:14px;}
.tag-restaurant{background:#fff8e1; color:#e65100; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}

/* 특이사항 중첩 드롭다운 (라운지 > 왕복/편도/리턴, 식당·라이딩 중복 선택) */
.spn-wrap{position:relative; display:inline-block; max-width:230px;}
.spn-btn{width:auto; max-width:230px; padding:8px 10px; border:1px solid #ccd3dc; border-radius:7px; background:#fff; font-weight:bold; color:#e65100; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left;}
.spn-btn.has-val{background:#fff3e0; border-color:#ffb74d;}
.spn-btn::after{content:" ▾"; font-size:11px; color:#999;}
.spn-panel{position:fixed; z-index:30000; min-width:170px; max-height:70vh; overflow-y:auto; background:#fff; border:1px solid #ccd3dc; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.22); padding:4px;}
.spn-item,.spn-opt{padding:9px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:14px; color:#333; display:flex; align-items:center; justify-content:space-between; gap:10px; user-select:none; -webkit-user-select:none;}
.spn-item:hover,.spn-opt:hover{background:#f1f5f9;}
.spn-item.on{color:#ad1457;}
.spn-arrow{font-size:11px; color:#888; transition:transform .15s;}
.spn-item.open .spn-arrow{transform:rotate(90deg);}
.spn-sub{margin:2px 0 4px 14px; padding-left:6px; border-left:2px solid #f3c6d8;}
.spn-sub .spn-opt{font-weight:normal;}
.spn-opt::after{content:""; width:16px; height:16px; border:1.5px solid #bbb; border-radius:4px; flex:0 0 16px; box-sizing:border-box;}
.spn-sub .spn-opt::after{border-radius:50%;}
.spn-opt.sel{color:#e65100; font-weight:bold; background:#fff8f0;}
.spn-opt.sel::after{content:"✔"; border-color:#e65100; background:#e65100; color:#fff; font-size:11px; line-height:13px; text-align:center;}

/* 라이딩 블록 이벤트 스타일 */
.fc-event.riding-block-event {
  text-align: left;
  font-weight: bold;
  font-size: 13.5px;
  padding: 2px 0;
  border-radius: 4px;
  margin-top: 2px;
}

.collapsible-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: #f0f4f8;
  border: 1px solid #dcdfe6;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: #17324d;
  transition: background 0.2s;
}
.collapsible-toggle:hover {
  background: #e2e8f0;
}

.stats-dropdown {
  position: relative;
  display: inline-block;
}
.stats-dropdown-content {
  display: none;
  position: absolute;
  right: 0;
  top: 100%;
  margin-top: 4px;
  background-color: #ffffff;
  min-width: 150px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  border-radius: 8px;
  overflow: hidden;
  z-index: 999;
  border: 1px solid #cbd5e1;
}
.stats-dropdown-content button {
  color: #333;
  padding: 10px 14px;
  text-decoration: none;
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid #f1f5f9;
  border-radius: 0;
  font-size: 13px;
  cursor: pointer;
}
.stats-dropdown-content button:last-child {
  border-bottom: none;
}
.stats-dropdown-content button:hover {
  background-color: #f1f5f9;
  color: #1769aa;
}
.stats-dropdown.show .stats-dropdown-content {
  display: block;
}

.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}
.modal-box {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #17324d;
  padding-bottom: 10px;
  margin-bottom: 16px;
}
.modal-header h2 {
  margin: 0;
  font-size: 18px;
  color: #17324d;
}
.modal-body {
  font-size: 15px;
  line-height: 1.6;
  color: #202733;
  margin-bottom: 20px;
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ===== Cost Sum 팝업 전용 스타일 ===== */
.modal-box.cost-sum-modal-box { max-width: 520px; }
.cs-table-wrap { border: 1px solid #d5dde8; border-radius: 10px; overflow: hidden; background: #fff; }
.cs-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.cs-table th { padding: 9px 8px; background: #eef2f7; color: #1e2b3a; font-size: 13px; font-weight: 700; text-align: right; white-space: nowrap; border-bottom: 1px solid #d5dde8; }
.cs-table th:first-child { text-align: center; }
.cs-table th:nth-child(2) { text-align: left; }
.cs-table td { padding: 9px 8px; text-align: right; white-space: nowrap; }
.cs-table td.cs-month { text-align: center; vertical-align: middle; background: #dfe7f1; color: #17324d; font-size: 15px; font-weight: 700; border-right: 2px solid #8fa3ba; border-bottom: 2px solid #8fa3ba; }
.cs-table td.cs-nat { text-align: left; font-weight: 700; color: #17324d; }
.cs-table tr.cs-kr td:not(.cs-month) { background: #d9f0fc; }
.cs-table tr.cs-cn td:not(.cs-month) { background: #fde3f0; }
.cs-table tr.cs-last td:not(.cs-month) { border-bottom: 2px solid #8fa3ba; }
.cs-table tr:last-child td { border-bottom: none; }
.cs-num { font-size: 16px; font-weight: 700; color: #17324d; }
.cs-krw { font-size: 16px; font-weight: 700; color: #2e7d32; }
.cs-table tr.cs-cn .cs-krw { color: #6a1b9a; }
.cs-detail-btn { display: block; width: 100%; margin: 10px 0; padding: 9px 12px; font-size: 13px; }
.cs-detail { margin-bottom: 12px; border: 1px solid #d5dde8; border-radius: 10px; overflow: hidden; }
.cs-d-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #fff; }
.cs-d-row:last-child { border-bottom: none; }
.cs-d-row.kr { background: #d9f0fc; }
.cs-d-row.cn { background: #fde3f0; }
.cs-d-label { flex: 0 0 84px; font-size: 13px; font-weight: 700; color: #17324d; line-height: 1.7; }
.cs-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.cs-chip { font-size: 12px; line-height: 1.6; padding: 0 8px; border-radius: 999px; background: #fff; color: #334155; white-space: nowrap; }
.cs-chip i { font-style: normal; color: #7a8599; }
.cs-rate { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 14px; margin-bottom: 8px; background: #fffbea; border: 1px solid #f3e6b3; border-radius: 10px; font-size: 12.5px; color: #6b5b1a; }
.cs-rate input { width: 80px; padding: 3px 6px; text-align: right; font-size: 13px; }
.cs-rate .cs-warn { color: #c62828; font-size: 12px; }
.cs-empty { padding: 18px; text-align: center; color: #888; font-size: 13px; }
.cs-note { font-size: 12px; color: #97a0af; text-align: center; margin-top: 4px; }
.cs-nav { margin-right: auto; display: flex; align-items: center; gap: 4px; }
.cs-nav b { font-size: 14px; min-width: 52px; text-align: center; }

/* 공지문 팝업 전용 스타일 */
.notice-modal-box {
  max-width: 90vw !important;
  width: 900px !important;
  height: 85vh;
  display: flex;
  flex-direction: column;
}
.notice-img-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #1e1e1e;
  border-radius: 8px;
  cursor: grab;
  touch-action: none;
  display: flex;
  justify-content: center;
  align-items: center;
}
.notice-img-viewport:active {
  cursor: grabbing;
}
.notice-img-viewport img {
  max-width: 100%;
  max-height: 100%;
  transform-origin: center center;
  transition: transform 0.05s ease-out;
  user-select: none;
  -webkit-user-drag: none;
}
.zoom-controls {
  position: absolute;
  bottom: 12px;
  right: 12px;
  display: flex;
  gap: 6px;
  background: rgba(0,0,0,0.6);
  padding: 6px 10px;
  border-radius: 20px;
  z-index: 10;
}
.zoom-controls button {
  background: white;
  color: #333;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

/* 이미지 전체화면 모달 전용 스타일 */
.fullscreen-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.95);
  z-index: 20000;
  display: flex;
  flex-direction: column;
}
.fullscreen-close-btn {
  position: absolute;
  top: 16px;
  right: 20px;
  background: rgba(255,255,255,0.2);
  color: white;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 20px;
  cursor: pointer;
  z-index: 20001;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fullscreen-close-btn:hover {
  background: rgba(255,255,255,0.4);
}

/* 엑셀 통계 이미지 캡처 전용 스타일 (화면에 보이지 않는 A4 세로 1장 레이아웃) */
.a4-portrait {
  width: 794px;
  min-height: 1123px;
  margin: 0 auto;
  background: #ffffff;
  padding: 30px 26px;
  box-sizing: border-box;
  font-family: "Twemoji Country Flags", Arial, "Malgun Gothic", sans-serif;
  color: #202733;
}
.a4-title {
  text-align: center;
  font-size: 19px;
  font-weight: bold;
  background: #e2efda;
  border: 1px solid #333;
  padding: 10px 6px;
}
.a4-stats-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 12px;
  margin-top: -1px;
}
.a4-stats-table th, .a4-stats-table td {
  border: 1px solid #333;
  padding: 5px 6px;
  vertical-align: middle;
  word-break: break-word;
}
.a4-stats-table thead th {
  background: #f2f2f2;
  text-align: center;
  font-weight: bold;
  font-size: 12.5px;
}
.a4-stats-table td.a4-col-date,
.a4-stats-table td.a4-col-total {
  text-align: center;
  white-space: nowrap;
}
.a4-stats-table td.a4-col-names {
  text-align: left;
  line-height: 1.35;
}
.a4-note {
  margin-top: -1px;
  text-align: center;
  font-weight: bold;
  color: #d32f2f;
  font-size: 11px;
  border: 1px solid #333;
  border-top: none;
  padding: 6px;
}
@media print {
  .a4-portrait { width: 210mm; min-height: 297mm; }
}

@media (max-width: 768px) {
  header{padding:12px 16px;}
  header h1{font-size:16px;}
  .wrap{padding:0 10px; margin:10px auto;}
  .card{padding:12px; margin-bottom:12px;}
  #calendar{padding:10px; zoom:0.85;}
  #calendar .fc-view-harness, #calendar .fc-scrollgrid, #calendar .fc-scrollgrid-sync-table, #calendar .fc-daygrid-body, #calendar .fc-col-header{width:100% !important;}
  #calendar .fc-daygrid-body, #calendar .fc-scrollgrid-sync-table{height:100% !important;}
  .fc .fc-toolbar-title{font-size:20px;}
  .fc .fc-button{padding:4px 8px; font-size:12px;}
  .stats{grid-template-columns:1fr;}
  .stat{padding:10px;}
  .stat b{font-size:18px;}
  .type-grid{grid-template-columns:1fr 1fr; gap:6px;}
  .type-grid > div:last-child{grid-column: span 2; text-align:right;}
  .master-grid{grid-template-columns:1fr 1fr;}
  button{padding:7px 10px; font-size:12px;}
}

/* 최상단으로 바로 가기 버튼 (드래그 이동 가능) */
#backToTopBtn{position:fixed; right:16px; bottom:24px; width:48px; height:48px; border-radius:50%; border:none; background:#17324d; color:#fff; font-size:22px; font-weight:bold; line-height:48px; text-align:center; padding:0; box-shadow:0 3px 10px rgba(0,0,0,.35); cursor:pointer; z-index:9999; opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s; touch-action:none; user-select:none; -webkit-user-select:none;}
#backToTopBtn.show{opacity:.92; visibility:visible;}

<script>
let db = null;
try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch(e) { console.log("Firebase Init Error:", e); }

let selectedDate = "";
let calendar = null;
let teamSeq = 0;
let linkedReturnTeams = [];

let masterRooms = {
  "6": { label: "6인실", totalRooms: 143, defaultCapPerRoom: 4, generalPeople: 100, generalCap: 3 },
  "4": { label: "4인실", totalRooms: 124, defaultCapPerRoom: 4, generalPeople: 50, generalCap: 2 },
  "2": { label: "2인실", totalRooms: 15, defaultCapPerRoom: 2, generalPeople: "", generalCap: "" },
  "dadami24": { label: "다다미24", totalRooms: 2, defaultCapPerRoom: 24, generalPeople: "", generalCap: "" },
  "dadami36": { label: "다다미36", totalRooms: 1, defaultCapPerRoom: 36, generalPeople: "", generalCap: "" }
};

function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

function getReturnDate(dateStr, nights) {
  const result = new Date(dateStr);
  const addDaysNum = Math.max(0, parseInt(nights, 10) - 1);
  result.setDate(result.getDate() + addDaysNum);
  return result.toISOString().split('T')[0];
}

function formatShortDate(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  return dateStr.substring(5);
}

function getDayColor(dateStr) {
  const dow = new Date(dateStr).getDay();
  if (dow === 2 || dow === 4 || dow === 0) {
    return '#FFB6C1';
  } else if (dow === 1 || dow === 3 || dow === 5) {
    return '#87CEEB';
  }
  return '#1769aa';
}

function markLoungeDates(loungeDates) {
  document.querySelectorAll('.lounge-emoji-badge').forEach(el => el.remove());
  loungeDates.forEach(d => {
    const cell = document.querySelector(`.fc-daygrid-day[data-date="${d}"]`);
    if (!cell) return;
    const frame = cell.querySelector('.fc-daygrid-day-frame') || cell;
    const badge = document.createElement('span');
    badge.className = 'lounge-emoji-badge';
    badge.title = '라운지 왕복/편도 단체 있음';
    badge.textContent = '🎤';
    frame.appendChild(badge);
  });
}

function markRestaurantDates(restaurantDates) {
  document.querySelectorAll('.restaurant-badge').forEach(el => el.remove());
  restaurantDates.forEach(d => {
    const cell = document.querySelector(`.fc-daygrid-day[data-date="${d}"]`);
    if (!cell) return;
    const frame = cell.querySelector('.fc-daygrid-day-frame') || cell;
    const badge = document.createElement('span');
    badge.className = 'restaurant-badge' + (frame.querySelector('.lounge-emoji-badge') ? ' under-mic' : '');
    badge.title = '식당 이용 단체 있음';
    badge.textContent = '®️';
    frame.appendChild(badge);
  });
}

function getDefaultNightsByDate(dateStr) {
  if (!dateStr) return "4";
  const dow = new Date(dateStr).getDay(); 
  if (dow === 3 || dow === 4 || dow === 5) {
    return "5";
  }
  return "4";
}

function normalizePattern(p){
  if (p === 'KR_ROUND' || p === 'CN_ROUND') return 'ROUND';
  return p || 'ROUND';
}

// 특이사항 파싱: 라운지(왕복/편도/리턴) / 식당 왕복 / 라이딩 은 중복 적용 가능 (기존 저장값도 그대로 인식)
function parseSpecialNote(specialNote){
  const r = { lounge:'', restaurant:'', riding:false };
  if (!specialNote) return r;
  String(specialNote).split('+').forEach(tok => {
    switch (tok.trim()) {
      case 'LOUNGE_ROUND': r.lounge = 'ROUND'; break;
      case 'LOUNGE_ONEWAY': r.lounge = 'ONEWAY'; break;
      case 'LOUNGE_RETURN': r.lounge = 'RETURN'; break;
      case 'RESTAURANT_ROUND': r.restaurant = 'ROUND'; break;
      case 'RESTAURANT_ONEWAY': r.restaurant = 'ONEWAY'; break;
      case 'RESTAURANT_RETURN': r.restaurant = 'RETURN'; break;
      case 'RIDING': r.riding = true; break;
      case 'RIDING_LOUNGE_ROUND': r.riding = true; r.lounge = 'ROUND'; break;
      case 'RIDING_LOUNGE_ONEWAY': r.riding = true; r.lounge = 'ONEWAY'; break;
    }
  });
  return r;
}

// 저장값 생성: 기존 값과 호환되도록 단일/기존 조합은 예전 값 그대로, 그 외 조합은 '+'로 연결
function buildSpecialNote(r){
  if (r.riding && r.lounge === 'ROUND' && !r.restaurant) return 'RIDING_LOUNGE_ROUND';
  if (r.riding && r.lounge === 'ONEWAY' && !r.restaurant) return 'RIDING_LOUNGE_ONEWAY';
  const a = [];
  if (r.riding) a.push('RIDING');
  if (r.lounge) a.push('LOUNGE_' + r.lounge);
  if (r.restaurant) a.push('RESTAURANT_' + r.restaurant);
  return a.join('+');
}

function getLoungeType(specialNote){
  return parseSpecialNote(specialNote).lounge || null;
}

function isRidingNote(specialNote){
  return parseSpecialNote(specialNote).riding;
}

function getRestaurantType(specialNote){
  return parseSpecialNote(specialNote).restaurant || null;
}

function isRestaurantNote(specialNote){
  return !!parseSpecialNote(specialNote).restaurant;
}

// ===== 특이사항 중첩 드롭다운 UI =====
let _spnOpenPanel = null;

function spnLabel(r){
  const parts = [];
  if (r.lounge) parts.push('🎤' + ({ROUND:'왕복', ONEWAY:'편도', RETURN:'리턴'}[r.lounge]));
  if (r.restaurant) parts.push('®️식당' + ({ROUND:'왕복', ONEWAY:'편도', RETURN:'리턴'}[r.restaurant]));
  if (r.riding) parts.push('🚴라이딩');
  return parts.length ? parts.join(' ') : '특이사항';
}

function buildSpecialNoteHTML(specialNote){
  const r = parseSpecialNote(specialNote);
  const val = buildSpecialNote(r);
  const G = (group, icon, name) => {
    const cur = r[group];
    const O = (v, t) => `<div class="spn-opt ${cur===v?'sel':''}" data-group="${group}" data-val="${v}" onclick="spnPickGroup(this)">${t}</div>`;
    return `<div class="spn-item ${cur?'on open':''}" data-group="${group}" onclick="spnToggleSub(this)"><span>${icon} ${name}</span><span class="spn-arrow">▶</span></div>
      <div class="spn-sub ${cur?'':'hidden'}">${O('ROUND','왕복')}${O('ONEWAY','편도')}${O('RETURN','리턴')}</div>`;
  };
  return `<div class="spn-wrap" data-value="${esc(val)}">
    <button type="button" class="spn-btn ${val?'has-val':''}" onclick="spnToggle(this)">${spnLabel(r)}</button>
    <div class="spn-panel hidden">
      ${G('lounge','🎤','라운지')}
      ${G('restaurant','®️','식당')}
      <div class="spn-opt ${r.riding?'sel':''}" data-key="riding" onclick="spnToggleCheck(this)">🚴 라이딩 왕복</div>
    </div>
  </div>`;
}

function spnCloseAll(){
  if (_spnOpenPanel) { _spnOpenPanel.classList.add('hidden'); _spnOpenPanel = null; }
}

function spnPosition(btn, panel){
  const b = btn.getBoundingClientRect();
  const pw = panel.offsetWidth, ph = panel.offsetHeight;
  let left = Math.min(b.left, window.innerWidth - pw - 8);
  if (left < 8) left = 8;
  panel.style.left = left + 'px';
  const below = window.innerHeight - b.bottom - 8;
  if (ph > below && b.top > below) {
    panel.style.top = 'auto';
    panel.style.bottom = (window.innerHeight - b.top + 4) + 'px';
    panel.style.maxHeight = Math.max(120, b.top - 12) + 'px';
  } else {
    panel.style.bottom = 'auto';
    panel.style.top = (b.bottom + 4) + 'px';
    panel.style.maxHeight = Math.max(120, below) + 'px';
  }
}

function spnToggle(btn){
  const panel = btn.closest('.spn-wrap').querySelector('.spn-panel');
  const willOpen = panel.classList.contains('hidden');
  spnCloseAll();
  if (willOpen) {
    panel.classList.remove('hidden');
    spnPosition(btn, panel);
    _spnOpenPanel = panel;
  }
}

function spnToggleSub(head){
  const sub = head.nextElementSibling;
  const willOpen = sub.classList.contains('hidden');
  sub.classList.toggle('hidden', !willOpen);
  head.classList.toggle('open', willOpen);
  const panel = head.closest('.spn-panel'), btn = head.closest('.spn-wrap').querySelector('.spn-btn');
  spnPosition(btn, panel);
}

function spnRefresh(wrap){
  const r = parseSpecialNote(wrap.dataset.value);
  const btn = wrap.querySelector('.spn-btn');
  btn.textContent = spnLabel(r);
  btn.classList.toggle('has-val', !!wrap.dataset.value);
  wrap.querySelectorAll('[data-group][data-val]').forEach(el => el.classList.toggle('sel', el.dataset.val === r[el.dataset.group]));
  wrap.querySelectorAll('.spn-item[data-group]').forEach(el => el.classList.toggle('on', !!r[el.dataset.group]));
  wrap.querySelectorAll('[data-key]').forEach(el => el.classList.toggle('sel', !!r[el.dataset.key]));
}

function spnPickGroup(opt){
  const wrap = opt.closest('.spn-wrap');
  const r = parseSpecialNote(wrap.dataset.value);
  const g = opt.dataset.group;
  r[g] = (r[g] === opt.dataset.val) ? '' : opt.dataset.val;
  wrap.dataset.value = buildSpecialNote(r);
  spnRefresh(wrap);
}

function spnToggleCheck(opt){
  const wrap = opt.closest('.spn-wrap');
  const r = parseSpecialNote(wrap.dataset.value);
  r[opt.dataset.key] = !r[opt.dataset.key];
  wrap.dataset.value = buildSpecialNote(r);
  spnRefresh(wrap);
}

function applyNoticeTransform() {
  const img = isFullScreenNotice ? document.getElementById("fullscreenNoticeImg") : document.getElementById("noticeImg");
  if (img) {
    img.style.transform = `translate(${noticeTranslateX}px, ${noticeTranslateY}px) scale(${noticeZoomScale})`;
  }
}

function adjustNoticeZoom(delta) {
  noticeZoomScale = Math.max(0.5, Math.min(5, noticeZoomScale + delta));
  applyNoticeTransform();
}

function resetNoticeZoom() {
  noticeZoomScale = 1;
  noticeTranslateX = 0;
  noticeTranslateY = 0;
  applyNoticeTransform();
}

function initNoticeViewerEvents(viewportId = "noticeViewport") {
  const viewport = document.getElementById(viewportId);
  if (!viewport) return;

  resetNoticeZoom();

  let hasMoved = false;

  viewport.onwheel = function(e) {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    adjustNoticeZoom(delta);
  };

  viewport.onmousedown = function(e) {
    if (e.target.tagName === 'BUTTON') return;
    isNoticeDragging = true;
    hasMoved = false;
    noticeStartX = e.clientX - noticeTranslateX;
    noticeStartY = e.clientY - noticeTranslateY;
  };

  const handleMouseMove = function(e) {
    if (!isNoticeDragging) return;
    hasMoved = true;
    noticeTranslateX = e.clientX - noticeStartX;
    noticeTranslateY = e.clientY - noticeStartY;
    applyNoticeTransform();
  };

  const handleMouseUp = function(e) {
    if (isNoticeDragging && !hasMoved && !isFullScreenNotice && e.target.tagName === 'IMG') {
      openNoticeFullScreen();
    }
    isNoticeDragging = false;
  };

  window.removeEventListener("mousemove", window._noticeMouseMoveHandler);
  window.removeEventListener("mouseup", window._noticeMouseUpHandler);

  window._noticeMouseMoveHandler = handleMouseMove;
  window._noticeMouseUpHandler = handleMouseUp;

  window.addEventListener("mousemove", handleMouseMove);
  window.addEventListener("mouseup", handleMouseUp);

  viewport.ontouchstart = function(e) {
    if (e.touches.length === 1) {
      isNoticeDragging = true;
      hasMoved = false;
      noticeStartX = e.touches[0].clientX - noticeTranslateX;
      noticeStartY = e.touches[0].clientY - noticeTranslateY;
    } else if (e.touches.length === 2) {
      isNoticeDragging = false;
      initialPinchDistance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  };

  viewport.ontouchmove = function(e) {
    if (e.touches.length === 1 && isNoticeDragging) {
      hasMoved = true;
      noticeTranslateX = e.touches[0].clientX - noticeStartX;
      noticeTranslateY = e.touches[0].clientY - noticeStartY;
      applyNoticeTransform();
    } else if (e.touches.length === 2 && initialPinchDistance) {
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = currentDist / initialPinchDistance;
      noticeZoomScale = Math.max(0.5, Math.min(5, noticeZoomScale * (factor > 1 ? 1.03 : 0.97)));
      initialPinchDistance = currentDist;
      applyNoticeTransform();
    }
  };

  viewport.ontouchend = function(e) {
    if (e.touches.length < 2) {
      initialPinchDistance = null;
    }
    if (e.touches.length === 0) {
      if (isNoticeDragging && !hasMoved && !isFullScreenNotice && e.target.tagName === 'IMG') {
        openNoticeFullScreen();
      }
      isNoticeDragging = false;
    }
  };
}

/* ===== Cost Sum 통계 : 월별 금액 가중평균 (KR: 월·수·금 / CN: 화·목·일 출발) ===== */
let costSumRows = null;   // { "YYYY-MM": { kr: {금액: 인원}, cn: {금액: 인원} } }
let costSumYear = null;
let costSumRate = null;   // 원화/인민폐 환율 (1 CNY = ? KRW)

function fetchCnyKrwRate() {
  const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 5000) : null;
  return fetch("https://open.er-api.com/v6/latest/CNY", ctrl ? { signal: ctrl.signal } : {})
    .then(r => r.json())
    .then(j => {
      if (timer) clearTimeout(timer);
      const v = j && j.rates ? Number(j.rates.KRW) : NaN;
      return v > 0 ? Math.round(v * 100) / 100 : null;
    })
    .catch(() => { if (timer) clearTimeout(timer); return null; });
}

function showCostSumStats() {
  if (!db) {
    alert("데이터베이스 연결이 없습니다.");
    return;
  }
  const currentDate = calendar ? calendar.view.currentStart : new Date();
  costSumYear = currentDate.getFullYear();

  openStatsModal("💰 Cost Summary", "<div style='text-align:center; padding:20px;'>통계 데이터를 불러오는 중...</div>");

  const ratePromise = costSumRate ? Promise.resolve(costSumRate) : fetchCnyKrwRate();

  Promise.all([db.collection("schedules").get(), ratePromise]).then(([querySnapshot, rate]) => {
    if (rate) costSumRate = rate;
    const rows = {};
    querySnapshot.forEach(doc => {
      const regDate = doc.id;
      const data = doc.data();
      if (!data.teams || data.teams.length === 0) return;

      const monthKey = regDate.substring(0, 7);
      const dow = new Date(regDate).getDay();
      let bucket = null;
      if (dow === 1 || dow === 3 || dow === 5) bucket = "kr";
      else if (dow === 2 || dow === 4 || dow === 0) bucket = "cn";
      if (!bucket) return;

      data.teams.forEach(t => {
        const people = parseInt(t.totalPeople || 0, 10);
        const m = String(t.price ?? "").replace(/,/g, "").match(/\d+(\.\d+)?/);
        if (!m || !(people > 0)) return;
        const price = parseFloat(m[0]);
        if (!(price > 0)) return;

        if (!rows[monthKey]) rows[monthKey] = { kr: {}, cn: {} };
        rows[monthKey][bucket][price] = (rows[monthKey][bucket][price] || 0) + people;
      });
    });
    costSumRows = rows;
    renderCostSum();
  }).catch(e => {
    console.error(e);
    openStatsModal("💰 Cost Summary", "<div style='color:red; text-align:center;'>통계 조회 중 오류가 발생했습니다.</div>");
  });
}

function changeCostSumYear(delta) {
  costSumYear += delta;
  renderCostSum();
}

function changeCostSumRate(v) {
  const n = parseFloat(String(v).replace(/,/g, ""));
  costSumRate = n > 0 ? n : null;
  renderCostSum();
}

let costSumDetailOpen = false;

function calcCostSumMonth(map) {
  if (!map || Object.keys(map).length === 0) return null;
  const prices = Object.keys(map).map(Number).sort((a, b) => a - b);
  let people = 0, amount = 0;
  prices.forEach(pr => { people += map[pr]; amount += pr * map[pr]; });
  return { prices, map, people, avg: Math.round(amount / people) };
}

function buildCostSumTable() {
  const rate = costSumRate;
  let body = "";
  let hasData = false;

  for (let m = 1; m <= 12; m++) {
    const rec = costSumRows[`${costSumYear}-${String(m).padStart(2, "0")}`];
    const kr = rec ? calcCostSumMonth(rec.kr) : null;
    const cn = rec ? calcCostSumMonth(rec.cn) : null;
    if (!kr && !cn) continue;
    hasData = true;

    const span = (kr ? 1 : 0) + (cn ? 1 : 0);
    let monthCell = `<td class="cs-month" rowspan="${span}">${m}월</td>`;

    if (kr) {
      body += `<tr class="cs-kr${cn ? "" : " cs-last"}">${monthCell}
        <td class="cs-nat">🇰🇷 KR</td>
        <td class="cs-krw">₩${kr.avg.toLocaleString()}</td>
        <td class="cs-num">₩${kr.avg.toLocaleString()}</td>
        <td>${kr.people.toLocaleString()}명</td>
      </tr>`;
      monthCell = "";
    }
    if (cn) {
      const krwCell = rate
        ? `<td class="cs-krw">₩${Math.round(cn.avg * rate / 1000).toLocaleString()}</td>`
        : `<td class="cs-krw" style="color:#aaa;">-</td>`;
      body += `<tr class="cs-cn cs-last">${monthCell}
        <td class="cs-nat">🇨🇳 CN</td>
        ${krwCell}
        <td class="cs-num">¥${cn.avg.toLocaleString()}</td>
        <td>${cn.people.toLocaleString()}명</td>
      </tr>`;
    }
  }

  if (!hasData) {
    body = `<tr><td colspan="5" class="cs-empty">${costSumYear}년 금액이 입력된 단체가 없습니다.</td></tr>`;
  }

  return `<div class="cs-table-wrap"><table class="cs-table">
    <thead><tr><th style="width:50px;">월</th><th>국적</th><th>원화 환산</th><th>인/평균</th><th>총인원</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

function buildCostSumDetail() {
  let items = "";
  for (let m = 1; m <= 12; m++) {
    const rec = costSumRows[`${costSumYear}-${String(m).padStart(2, "0")}`];
    if (!rec) continue;
    [["kr", "🇰🇷 KR"], ["cn", "🇨🇳 CN"]].forEach(([key, label]) => {
      const info = calcCostSumMonth(rec[key]);
      if (!info) return;
      const chips = info.prices.map(pr =>
        `<span class="cs-chip"><b>${pr.toLocaleString()}</b> <i>(${info.map[pr].toLocaleString()}명)</i></span>`
      ).join("");
      items += `<div class="cs-d-row ${key}"><div class="cs-d-label">${m}월 ${label}</div><div class="cs-chips">${chips}</div></div>`;
    });
  }
  if (!items) items = `<div class="cs-empty">상세 내역이 없습니다.</div>`;
  return `<div id="costSumDetail" class="cs-detail" style="display:${costSumDetailOpen ? "block" : "none"};">${items}</div>`;
}

function toggleCostSumDetail() {
  costSumDetailOpen = !costSumDetailOpen;
  const panel = document.getElementById("costSumDetail");
  const btn = document.getElementById("costSumDetailBtn");
  if (panel) panel.style.display = costSumDetailOpen ? "block" : "none";
  if (btn) btn.textContent = costSumDetailOpen ? "▲ 상세보기 닫기" : "▼ 금액별 인원 상세보기";
}

function renderCostSum() {
  const rateBar = `<div class="cs-rate">
    <span>💱 오늘 환율 1위안 =</span>

function showMonthlyStats() {
  if (!db) {
    alert("데이터베이스 연결이 없습니다.");
    return;
  }

  const currentDate = calendar ? calendar.view.currentStart : new Date();
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth() + 1;
  const mm = String(month).padStart(2, '0');

  openStatsModal(`${month}월 단체 통계`, "<div style='text-align:center; padding:20px;'>통계 데이터를 불러오는 중...</div>");

  db.collection("schedules").get().then(querySnapshot => {
    let krPeople = 0, krGroupCount = 0;
    let cnPeople = 0, cnGroupCount = 0;

    querySnapshot.forEach(doc => {
      const regDate = doc.id;
      if (regDate.startsWith(`${year}-${mm}`)) {
        const data = doc.data();
        if (data.teams && data.teams.length > 0) {
          const dow = new Date(regDate).getDay();

          data.teams.forEach(t => {
            const people = parseInt(t.totalPeople || 0, 10);
            if (dow === 1 || dow === 3 || dow === 5) {
              krPeople += people;
              krGroupCount++;
            } else if (dow === 2 || dow === 4 || dow === 0) {
              cnPeople += people;
              cnGroupCount++;
            }
          });
        }
      }
    });

    const totalPeople = krPeople + cnPeople;

    const summaryHtml = `
      <div style="background:#f8fafc; padding:24px 20px; border-radius:8px; border:1px solid #e2e8f0; text-align:center; font-size:16px; color:#17324d; line-height:1.8;">
        ${month}월 한단 ${krPeople.toLocaleString()}명 + 중단 ${cnPeople.toLocaleString()}명<br>
        = <b style="color:#2e7d32; font-size:20px;">총 ${totalPeople.toLocaleString()}명</b> (${krGroupCount}팀 / ${cnGroupCount}팀)
      </div>
    `;

    openStatsModal(`${month}월 단체 (편도 기준)`, summaryHtml);
  }).catch(e => {
    console.error(e);
    openStatsModal(`${month}월 단체 (편도 기준)`, "<div style='color:red; text-align:center;'>데이터를 불러오는 도중 오류가 발생했습니다.</div>");
  });
}

function showRidingStats() {
  if (!db) {
    alert("데이터베이스 연결이 없습니다.");
    return;
  }

  openStatsModal("🚴 라이딩 통계(편도 기준)", "<div style='text-align:center; padding:20px;'>라이딩 데이터를 불러오는 중...</div>");

  db.collection("schedules").get().then(querySnapshot => {
    let monthlyStats = {};

    querySnapshot.forEach(doc => {
      const regDate = doc.id;
      const monthKey = regDate.substring(0, 7);
      const data = doc.data();

      if (data.teams && data.teams.length > 0) {
        data.teams.forEach(t => {
          if (t.isRiding) {
            if (!monthlyStats[monthKey]) {
              monthlyStats[monthKey] = { people: 0, groups: 0 };
            }
            monthlyStats[monthKey].people += parseInt(t.totalPeople || 0, 10);
            monthlyStats[monthKey].groups += 1;
          }
        });
      }
    });

    const sortedMonths = Object.keys(monthlyStats).sort();

    if (sortedMonths.length === 0) {
      openStatsModal("🚴 라이딩 통계(편도 기준)", "<div style='text-align:center; padding:20px; color:#666;'>등록된 라이딩 단체가 없슴다.</div>");

        </tr>
      </thead>

    let grandPeople = 0;

    sortedMonths.forEach(m => {

      grandPeople += p;
      grandGroups += g;
      const [yyyy, mm] = m.split("-");

      html += `<tr>
        <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;"><b>${yyyy}년 ${parseInt(mm, 10)}월</b></td>

function showLoungeStats() {

  db.collection("schedules").get().then(querySnapshot => {
    let loungeTeams = [];
    let restaurantTeams = [];

    querySnapshot.forEach(doc => {
      const regDate = doc.id;
      if (!regDate.startsWith(`${year}-${mm}`)) return;
      const data = doc.data();
      if (!data.teams || data.teams.length === 0) return;

      data.teams.forEach(t => {
        const loungeType = getLoungeType(t.specialNote);
        const restaurantType = getRestaurantType(t.specialNote);
        if (!loungeType && !restaurantType) return;

        const defaultNights = getDefaultNightsByDate(regDate);
        const nights = parseInt(t.nights || defaultNights, 10);
        const returnDate = getReturnDate(regDate, nights);

        let people = parseInt(t.totalPeople || 0, 10);
        if (t.isSplitRoom) {
          people = (t.outAllocations || []).reduce((sum, a) => sum + (parseInt(a.people, 10) || 0), 0);
        }

        if (loungeType) {
          loungeTeams.push({
            name: t.name || "",
            people: people,
            isRound: loungeType === 'ROUND',
            isReturnOnly: loungeType === 'RETURN',
            goDate: regDate,
            returnDate: returnDate
          });
        }

        if (restaurantType) {
          restaurantTeams.push({
            name: t.name || "",
            people: people,
            isRound: restaurantType === 'ROUND',
            isReturnOnly: restaurantType === 'RETURN',
            goDate: regDate,
            returnDate: returnDate
          });
        }
      });
    });

    loungeTeams.sort((a, b) => a.goDate.localeCompare(b.goDate));
    restaurantTeams.sort((a, b) => a.goDate.localeCompare(b.goDate));

    if (loungeTeams.length === 0 && restaurantTeams.length === 0) {
      openStatsModal(`🎤 ${month}월 라운지 이용 단체`, "<div style='text-align:center; padding:20px; color:#666;'>이번 달 등록된 라운지 이용 단체가 없슴다.</div>");

      const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

            const end = new Date(h.end);
            while (cur <= end) {
              const dateStr = cur.toISOString().split('T')[0];
              events.push({
                title: `🇨🇳 ${h.name}`,
                start: dateStr,
                allDay: true,
                backgroundColor: '#e1bee7',
                borderColor: '#ce93d8',
                textColor: '#4a148c',
                order: 1
              });
              cur.setDate(cur.getDate() + 1);
            }
          });
          successCallback(events);
        }
      },
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("schedules").get().then((querySnapshot) => {
            let dailyAll = {};
            let ridingCounts = {};
            let loungeDates = new Set();
            let restaurantDates = new Set();

            querySnapshot.forEach((doc) => {
              const regDate = doc.id;
              const data = doc.data();
              if (data.teams && data.teams.length > 0) {
                data.teams.forEach(t => {
                  const defaultNights = getDefaultNightsByDate(regDate);
                  const nights = parseInt(t.nights || defaultNights, 10);
                  const pattern = normalizePattern(t.pattern);
                  const returnDate = getReturnDate(regDate, nights);

                  let outP = 0;
                  let inP = 0;

                  if (t.isSplitRoom) {
                    outP = (t.outAllocations || []).reduce((sum, a) => sum + (parseInt(a.people, 10) || 0), 0);
                    inP = (t.inAllocations || []).reduce((sum, a) => sum + (parseInt(a.people, 10) || 0), 0);

                    if (pattern === 'ROUND') {
                      dailyAll[regDate] = (dailyAll[regDate] || 0) + outP;
                      dailyAll[returnDate] = (dailyAll[returnDate] || 0) + inP;
                    } else {
                      dailyAll[regDate] = (dailyAll[regDate] || 0) + outP;
                    }
                  } else {
                    const p = parseInt(t.totalPeople || 0, 10);
                    outP = p;
                    inP = p;
                    if (pattern === 'ROUND') {
                      dailyAll[regDate] = (dailyAll[regDate] || 0) + p;
                      dailyAll[returnDate] = (dailyAll[returnDate] || 0) + p;
                    } else {
                      dailyAll[regDate] = (dailyAll[regDate] || 0) + p;
                    }
                  }

                  if (t.isRiding) {
                    ridingCounts[regDate] = (ridingCounts[regDate] || 0) + outP;
                    if (pattern === 'ROUND') {
                      ridingCounts[returnDate] = (ridingCounts[returnDate] || 0) + inP;
                    }
                  }

                  const loungeTypeForDate = getLoungeType(t.specialNote);
                  if (loungeTypeForDate) {
                    if (loungeTypeForDate !== 'RETURN') loungeDates.add(regDate);
                    if (loungeTypeForDate === 'ROUND' || loungeTypeForDate === 'RETURN') loungeDates.add(returnDate);
                  }
                  const restaurantTypeForDate = getRestaurantType(t.specialNote);
                  if (restaurantTypeForDate) {
                    if (restaurantTypeForDate !== 'RETURN') restaurantDates.add(regDate);
                    if (restaurantTypeForDate === 'ROUND' || restaurantTypeForDate === 'RETURN') restaurantDates.add(returnDate);
                  }
                });
              }
            });

            let events = [];
            Object.keys(dailyAll).forEach(d => {
              if (dailyAll[d] > 0) {
                events.push({ 
                  title: `${dailyAll[d]}`, 
                  start: d, 
                  color: getDayColor(d),
                  textColor: '#000000',
                  order: 2
                });
              }
            });

            Object.keys(ridingCounts).forEach(d => {
              if (ridingCounts[d] > 0) {
                events.push({
                  title: `🚴${ridingCounts[d]}`,
                  start: d,
                  backgroundColor: '#fff3e0',
                  borderColor: '#ffe0b2',
                  textColor: '#e65100',
                  className: 'riding-block-event',
                  order: 99
                });
              }
            });

            successCallback(events);
            markLoungeDates(loungeDates);
            markRestaurantDates(restaurantDates);
          }).catch(() => successCallback([]));
        }
      },
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("custom_events").get().then((querySnapshot) => {
            let events = [];
            querySnapshot.forEach((doc) => {
              const items = getMemoItemsFromDocData(doc.data());
              items.forEach((item) => {
                let evtColor = item.color || '#fffde7';
                let txtColor = getMemoTextColor(evtColor);
                let titleText = item.title || "메모";

                const flagEmoji = getMemoFlagEmoji(item, evtColor);
                if (flagEmoji) titleText = `${flagEmoji} ${titleText}`;

                events.push({
                  id: "ce_" + doc.id + "_" + item.id,
                  title: titleText,
                  start: doc.id,
                  color: evtColor,
                  textColor: txtColor,
                  order: 3
                });
              });
            });
            successCallback(events);
          }).catch(() => successCallback([]));
        }
      }
    ]
  });
  calendar.render();

  let touchStartX = 0;
  let touchStartY = 0;

  function handleSwipeStart(e) {
    const touch = e.touches ? e.touches[0] : e;
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }

  function handleSwipeEnd(e) {
    if (!touchStartX) return;
    const touch = e.changedTouches ? e.changedTouches[0] : e;
    const diffX = touch.clientX - touchStartX;
    const diffY = touch.clientY - touchStartY;

    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
      if (diffX > 0) {
        calendar.prev();
      } else {
        calendar.next();
      }
    }
    touchStartX = 0;
    touchStartY = 0;
  }

  calendarEl.addEventListener('touchstart', handleSwipeStart, { passive: true });
  calendarEl.addEventListener('touchend', handleSwipeEnd, { passive: true });
  calendarEl.addEventListener('mousedown', handleSwipeStart);
  calendarEl.addEventListener('mouseup', handleSwipeEnd);
});

// 날짜 문서(data)에서 메모 항목 배열을 뽑아냄. 신규 방식(items 배열)과
// 기존 단일 메모 방식(title/color) 문서를 모두 호환 처리.
function getMemoItemsFromDocData(data){
  if(!data) return [];
  if(Array.isArray(data.items)){
    return data.items;
  }
  if(data.title){
    return [{ id: "legacy", title: data.title, color: data.color || "#fffde7" }];
  }
  return [];
}

// 지정된 색상 배경 위에서 잘 보이는 글자색을 계산 (밝기 기준 자동 대비).
// 기존에 이미 쓰이던 색상들은 원래 지정되어 있던 글자색을 그대로 유지.
function getMemoTextColor(color){
  const legacyMap = {
    "#fffde7": "#f57f17",
    "#9e9e9e": "#ffffff",
    "#aed581": "#1b5e20",
    "#e1bee7": "#4a148c",
    "#f57c00": "#ffffff"
  };
  if(legacyMap[color]) return legacyMap[color];

  const hex = (color || "#fffde7").replace("#", "");
  const r = parseInt(hex.substring(0,2), 16) || 0;
  const g = parseInt(hex.substring(2,4), 16) || 0;
  const b = parseInt(hex.substring(4,6), 16) || 0;
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? "#374151" : "#ffffff";
}

// 국기 태그(item.flag: 'kr' | 'cn' | '')에 해당하는 이모지를 반환.
// 신규 방식(item.flag)이 없는 기존 메모는 예전처럼 색상 기준으로 국기를 판단(하위호환).
function getMemoFlagEmoji(item, evtColor){
  const flag = (item && item.flag !== undefined) ? item.flag : null;
  if(flag === 'kr') return '🇰🇷';
  if(flag === 'cn') return '🇨🇳';
  if(flag === '') return '';
  // 하위호환: flag 필드가 없는 기존 메모
  if(evtColor === '#e1bee7') return '🇨🇳';
  if(evtColor === '#f57c00') return '🇰🇷';
  return '';
}

function addMemoItem(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr){ alert("날짜를 선택해주세요."); return; }
  const title = document.getElementById("eventTitle").value.trim();

  const flag = document.getElementById("eventFlag").value;

  if(!title){ alert("내용을 입력해주세요."); return; }
  if(!db) return;

  if(editingMemoId){ updateMemoItem(dateStr, title, color, flag); return; }

  const endStr = (document.getElementById("eventEndDate").value || "").trim();
  if(endStr){ addMemoRange(dateStr, endStr, title, color, flag); return; }

  const docRef = db.collection("custom_events").doc(dateStr);
  docRef.get().then(doc => {
    const items = doc.exists ? getMemoItemsFromDocData(doc.data()) : [];
    const newItem = { id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), title, color, flag };
    items.push(newItem);
    docRef.set({ items, updatedAt: new Date() }).then(() => {

      renderFlagPicker("");

  });
}

// 기간(시작일~종료일) 전체에 같은 메모를 한꺼번에 등록
function addMemoRange(startStr, endStr, title, color, flag){
  const start = new Date(startStr + "T00:00:00Z");
  const end = new Date(endStr + "T00:00:00Z");
  if(isNaN(start) || isNaN(end)){ alert("날짜 형식이 올바르지 않습니다."); return; }
  if(end < start){ alert("종료일은 시작일보다 같거나 늦어야 합니다."); return; }

  const dates = [];
  for(let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)){
    dates.push(d.toISOString().slice(0,10));
    if(dates.length > 366){ alert("기간은 최대 366일까지 선택할 수 있습니다."); return; }
  }
  if(!confirm(`${startStr} ~ ${endStr} (${dates.length}일) 전체에 이 메모를 등록하시겠습니까?`)) return;

  Promise.all(dates.map(ds => db.collection("custom_events").doc(ds).get())).then(snaps => {
    const writes = snaps.map((snap, i) => {
      const items = snap.exists ? getMemoItemsFromDocData(snap.data()) : [];
      items.push({ id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), title, color, flag });
      return { ref: db.collection("custom_events").doc(dates[i]), items };
    });
    const commits = [];
    for(let i = 0; i < writes.length; i += 400){
      const batch = db.batch();
      writes.slice(i, i + 400).forEach(w => batch.set(w.ref, { items: w.items, updatedAt: new Date() }));
      commits.push(batch.commit());
    }
    return Promise.all(commits);
  }).then(() => {
    document.getElementById("eventTitle").value = "";
    document.getElementById("eventEndDate").value = "";
    document.getElementById("eventFlag").value = "";
    renderFlagPicker("");
    loadEventDataForDate(startStr);
    if(calendar) calendar.refetchEvents();
    alert(`${dates.length}일 분량의 메모가 등록되었습니다.`);
  }).catch(err => {
    console.error("기간 메모 등록 오류", err);
    alert("기간 메모 등록 중 오류가 발생했습니다.");
  });
}

// 이미 등록된 메모를 입력창으로 불러와 수정 모드로 전환
function startEditMemo(dateStr, itemId){
  const item = eventMemoCache[itemId];
  if(!item) return;
  editingMemoId = itemId;
  editingMemoDate = dateStr;

  const color = item.color || "#fffde7";
  let flag = item.flag;
  if(flag === undefined){
    flag = (color === "#e1bee7") ? "cn" : (color === "#f57c00") ? "kr" : "";
  }

  document.getElementById("eventTitle").value = item.title || "";
  document.getElementById("eventColor").value = color;
  document.getElementById("eventFlag").value = flag;
  renderColorPicker(color);
  renderFlagPicker(flag);

  const endEl = document.getElementById("eventEndDate");
  endEl.value = "";
  endEl.disabled = true;

  const btn = document.getElementById("memoSubmitBtn");
  btn.textContent = "수정 저장";
  document.getElementById("memoCancelEditBtn").classList.remove("hidden");
  document.getElementById("eventTitle").focus();
}

function cancelEditMemo(silent){
  const wasEditing = !!editingMemoId;
  editingMemoId = null;
  editingMemoDate = null;
  const btn = document.getElementById("memoSubmitBtn");
  if(btn) btn.textContent = "메모 추가";
  const cancelBtn = document.getElementById("memoCancelEditBtn");
  if(cancelBtn) cancelBtn.classList.add("hidden");
  const endEl = document.getElementById("eventEndDate");
  if(endEl) endEl.disabled = false;
  if(wasEditing && !silent){
    document.getElementById("eventTitle").value = "";
    document.getElementById("eventColor").value = "#fffde7";
    document.getElementById("eventFlag").value = "";
    renderColorPicker("#fffde7");
    renderFlagPicker("");
  }
}

// 수정 모드에서 '수정 저장' 시 해당 메모 항목만 갱신
function updateMemoItem(dateStr, title, color, flag){
  const targetDate = editingMemoDate || dateStr;
  const itemId = editingMemoId;
  const docRef = db.collection("custom_events").doc(targetDate);
  docRef.get().then(doc => {
    if(!doc.exists){ alert("수정할 메모를 찾을 수 없습니다."); cancelEditMemo(); return; }
    const items = getMemoItemsFromDocData(doc.data());
    const idx = items.findIndex(it => it.id === itemId);
    if(idx < 0){ alert("수정할 메모를 찾을 수 없습니다."); cancelEditMemo(); return; }
    items[idx] = { ...items[idx], id: itemId === "legacy" ? "legacy" : itemId, title, color, flag };
    docRef.set({ items, updatedAt: new Date() }).then(() => {
      cancelEditMemo();
      renderEventMemoList(targetDate, items);
      if(calendar) calendar.refetchEvents();
    });
  });
}

function deleteMemoItem(dateStr, itemId){
  if(!dateStr || !db) return;
  if(!confirm("이 메모를 삭제하시겠습니까?")) return;
  if(editingMemoId === itemId) cancelEditMemo();

  const docRef = db.collection("custom_events").doc(dateStr);
  docRef.get().then(doc => {
    if(!doc.exists) return;
    const items = getMemoItemsFromDocData(doc.data()).filter(item => item.id !== itemId);
    if(items.length === 0){
      docRef.delete().then(() => {
        renderEventMemoList(dateStr, []);
        if(calendar) calendar.refetchEvents();
      });
    } else {
      docRef.set({ items, updatedAt: new Date() }).then(() => {
        renderEventMemoList(dateStr, items);
        if(calendar) calendar.refetchEvents();
      });
    }
  });
}

async function openDateSim(dateStr){
  selectedDate = dateStr;
  document.getElementById("selectedDateText").innerText = dateStr;

  resetMasterData();
  document.getElementById("teamsContainer").innerHTML = "";

  linkedReturnTeams = [];

  if (db) {
    try {
      const allDocs = await db.collection("schedules").get();
      allDocs.forEach(doc => {
        const regDate = doc.id;
        if (regDate !== dateStr) {
          const data = doc.data();
          if (data.teams && data.teams.length > 0) {
            data.teams.forEach(t => {
              const pattern = normalizePattern(t.pattern);
              const defaultNights = getDefaultNightsByDate(regDate);
              const nights = parseInt(t.nights || defaultNights, 10);
              const retDate = getReturnDate(regDate, nights);
              
              if (retDate === dateStr && pattern === 'ROUND') {
                linkedReturnTeams.push({
                  ...t,
                  regDate: regDate,
                  isReturnOnTarget: true
                });
              }
            });
          }
        }
      });
    } catch(e) { console.error("리턴 단체 조회 오류", e); }
  }

  if(db){
    db.collection("schedules").doc(dateStr).get().then((doc) => {
      if(doc.exists){
        const data = doc.data();
        if(data.masterRooms) masterRooms = data.masterRooms;
        initMasterRoomsUI();
        if(data.teams && data.teams.length > 0){
          data.teams.forEach(t => restoreTeamUI(t));
        } else { addTeam(); }
        runSimulation(false);
      } else {
        initMasterRoomsUI();
        addTeam();
        runSimulation(false);
      }
    }).catch(() => {
      initMasterRoomsUI();
      addTeam();
      runSimulation(false);
    });
  } else {
    initMasterRoomsUI();
    addTeam();
    runSimulation(false);
  }

  document.getElementById("simSection").scrollIntoView({ behavior: 'smooth' });
}

/* ===== 월별 기본 일반 여객 (11~4월 비수기 70명: 6인실 50/4인실 20, 5~10월 성수기 100명: 6인실 70/4인실 30) ===== */
const MONTHLY_DEFAULTS_KEY = "monthlyGeneralDefaults";
function getSeasonalMonthlyDefaults(){
  const o = {};
  for(let m = 1; m <= 12; m++){
    const peak = (m >= 5 && m <= 10);
    o[m] = { g6: peak ? 70 : 50, g4: peak ? 30 : 20 };
  }
  return o;
}
let monthlyDefaults = getSeasonalMonthlyDefaults();

function normalizeMonthlyDefaults(raw){
  const base = getSeasonalMonthlyDefaults();
  if(!raw) return base;
  for(let m = 1; m <= 12; m++){
    const r = raw[m] || raw[String(m)];
    if(r){
      const a = parseInt(r.g6, 10), b = parseInt(r.g4, 10);
      if(!isNaN(a)) base[m].g6 = Math.max(0, a);
      if(!isNaN(b)) base[m].g4 = Math.max(0, b);
    }
  }
  return base;
}

function getMonthlyDefault(dateStr){
  const month = parseInt(String(dateStr || "").substring(5, 7), 10);
  return monthlyDefaults[month] || { g6: 70, g4: 30 };
}

function renderMonthlyDefaultsUI(){
  const grid = document.getElementById("monthlyDefaultsGrid");
  if(!grid) return;
  let html = "";
  for(let m = 1; m <= 12; m++){
    const v = monthlyDefaults[m];
    html += `
      <div style="background:#fff; border:1px solid #dcdfe6; border-radius:6px; padding:6px;">
        <div style="font-weight:bold; font-size:12px; margin-bottom:3px;">${m}월 <span id="md_total_${m}" class="small" style="font-weight:normal;">(합계 ${v.g6 + v.g4}명)</span></div>
        <div style="display:flex; gap:4px; align-items:center;">
          <span class="small">6인실</span><input type="number" min="0" id="md_g6_${m}" value="${v.g6}" oninput="updateMonthlyTotal(${m})" style="padding:4px;">
        </div>
        <div style="display:flex; gap:4px; align-items:center; margin-top:3px;">
          <span class="small">4인실</span><input type="number" min="0" id="md_g4_${m}" value="${v.g4}" oninput="updateMonthlyTotal(${m})" style="padding:4px;">

      </div>`;
  }
  grid.innerHTML = html;
}

function updateMonthlyTotal(m){

  const b = parseInt(document.getElementById(`md_g4_${m}`).value, 10) || 0;
  document.getElementById(`md_total_${m}`).innerText = `(합계 ${a + b}명)`;
}

function saveMonthlyDefaults(){
  const raw = {};
  for(let m = 1; m <= 12; m++){
    raw[m] = {
      g6: Math.max(0, parseInt(document.getElementById(`md_g6_${m}`).value, 10) || 0),
      g4: Math.max(0, parseInt(document.getElementById(`md_g4_${m}`).value, 10) || 0)
    };
  }
  monthlyDefaults = normalizeMonthlyDefaults(raw);
  try { localStorage.setItem(MONTHLY_DEFAULTS_KEY, JSON.stringify(monthlyDefaults)); } catch(e) {}
  if(db){
    db.collection("settings").doc(MONTHLY_DEFAULTS_KEY).set({ months: monthlyDefaults, updatedAt: new Date() })

  } else {

  }
}

function loadMonthlyDefaults(){

function extractAllocations(typeDivs) {
  let totalPeople = 0;
  let allocations = [];
  typeDivs.forEach(td => {
    const key = td.querySelector(".typeSelect").value;
    const people = parseInt(td.querySelector(".assignPeople").value, 10) || 0;
    const cap = parseInt(td.querySelector(".capPerRoom").value, 10) || 1;

    if(people > 0){
      totalPeople += people;
      const roomsNeeded = Math.ceil(people / cap);
      allocations.push({ key, label: masterRooms[key].label, people, cap, roomsNeeded, totalRooms: masterRooms[key].totalRooms });
    }
  });
  return { totalPeople, allocations };
}

function runSimulation(shouldSave = true){
  const teamCards = [...document.querySelectorAll("#teamsContainer .team-card")];

  let todayTeams = [];
  let groupRoomUsed = { "6": 0, "4": 0, "2": 0, "dadami24": 0, "dadami36": 0 };
  let groupPeopleUsed = { "6": 0, "4": 0, "2": 0, "dadami24": 0, "dadami36": 0 };

  const defaultNights = getDefaultNightsByDate(selectedDate);

  for (let idx = 0; idx < teamCards.length; idx++) {
    const card = teamCards[idx];
    const name = card.querySelector(".teamName").value.trim();
    const pattern = normalizePattern(card.querySelector(".teamPattern").value);
    const nights = parseInt(card.querySelector(".teamNights").value, 10) || parseInt(defaultNights, 10);
    const price = card.querySelector(".teamPrice").value.trim();
    const memo = card.querySelector(".teamMemo").value.trim();
    const isSplitRoom = card.querySelector(".splitRoomCheck").checked;
    const specialNote = card.querySelector(".spn-wrap").dataset.value || "";
    const isRiding = isRidingNote(specialNote);

    if (!name && !card.querySelector(".assignPeople")?.value) continue;

    let teamTotalPeople = 0;
    let allocations = [];
    let outAllocations = [];
    let inAllocations = [];

    if(!isSplitRoom) {
      const typeDivs = [...card.querySelectorAll(".normalRoomArea .type-card")];
      const res = extractAllocations(typeDivs);
      teamTotalPeople = res.totalPeople;
      allocations = res.allocations;

      if(teamTotalPeople <= 0 && shouldSave) {
        alert(`[${name || '단체'}] 단체의 배정 인원을 입력해주세요.`);
        card.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      
      if (pattern === 'ROUND' || pattern === 'ONEWAY_OUT') {
        allocations.forEach(a => {
          groupRoomUsed[a.key] += a.roomsNeeded;
          groupPeopleUsed[a.key] += a.people;
        });
      }

    } else {
      const outDivs = [...card.querySelectorAll(".splitRoomArea .outRoomTypesContainer .type-card")];
      const inDivs = [...card.querySelectorAll(".splitRoomArea .inRoomTypesContainer .type-card")];
      const outRes = extractAllocations(outDivs);
      const inRes = extractAllocations(inDivs);
      
      outAllocations = outRes.allocations;
      inAllocations = inRes.allocations;
      teamTotalPeople = outRes.totalPeople;

      if((outRes.totalPeople <= 0 || inRes.totalPeople <= 0) && shouldSave) {
        alert(`[${name || '단체'}] 단체의 출국 및 입국 배정 인원을 모두 입력해주세요.`);
        card.scrollIntoView({ behavior: 'smooth' });
        return;
      }

      if (pattern === 'ROUND' || pattern === 'ONEWAY_OUT') {
        outAllocations.forEach(a => {
          groupRoomUsed[a.key] += a.roomsNeeded;
          groupPeopleUsed[a.key] += a.people;
        });
      }
    }

    const returnDate = getReturnDate(selectedDate, nights);
    const selShort = formatShortDate(selectedDate);
    const retShort = formatShortDate(returnDate);

    let itineraryStr = "";
    if(pattern === 'ROUND') {
      itineraryStr = `출국: ${selShort} ~ 리턴: ${retShort} (${nights}박)`;
    } else if(pattern === 'ONEWAY_OUT') {
      itineraryStr = `출국: ${selShort} (편도)`;
    } else {
      itineraryStr = `입국: ${selShort} (편도)`;
    }

    todayTeams.push({
      name: name || `단체 ${idx+1}`,
      pattern, nights, price, memo, isSplitRoom, isRiding, specialNote,
      totalPeople: teamTotalPeople,
      allocations, outAllocations, inAllocations,
      itineraryStr, returnDate,
      isReturnOnTarget: false
    });
  }

  linkedReturnTeams.forEach(t => {
    let targetAlloc = t.isSplitRoom ? (t.inAllocations || []) : (t.allocations || []);
    targetAlloc.forEach(a => {
      if(groupRoomUsed[a.key] !== undefined) {
        groupRoomUsed[a.key] += a.roomsNeeded;
        groupPeopleUsed[a.key] += a.people;
      }
    });
  });

  const todayOutTeams = todayTeams.filter(t => t.pattern === 'ROUND' || t.pattern === 'ONEWAY_OUT');
  const outBoardingTeams = [...todayOutTeams, ...linkedReturnTeams];

  const isLoungeTeam = (t) => { const lt = getLoungeType(t.specialNote); return !!lt && (lt !== 'RETURN' || !!t.isReturnOnTarget); };
  outBoardingTeams.sort((a, b) => (isLoungeTeam(a) ? 0 : 1) - (isLoungeTeam(b) ? 0 : 1));

  const groupTotalPeople = outBoardingTeams.reduce((s,t) => {
    if (t.isReturnOnTarget) {
      if (t.isSplitRoom) {
        return s + (t.inAllocations || []).reduce((sum, a) => sum + a.people, 0);
      }
      return s + t.totalPeople;
    } else {
      if (t.isSplitRoom) {
        return s + (t.outAllocations || []).reduce((sum, a) => sum + a.people, 0);
      }
      return s + t.totalPeople;
    }
  }, 0);

  const newTeamsPeople = todayOutTeams.reduce((sum, t) => sum + (t.isSplitRoom ? (t.outAllocations || []).reduce((s, a) => s + a.people, 0) : t.totalPeople), 0);
  const returnTeamsPeople = linkedReturnTeams.reduce((sum, t) => sum + (t.isSplitRoom ? (t.inAllocations || []).reduce((s, a) => s + a.people, 0) : t.totalPeople), 0);

  const groupTotalRooms = Object.values(groupRoomUsed).reduce((a,b)=>a+b, 0);

  let generalTotalPeople = 0;
  let generalRoomUsed = {};

  Object.keys(masterRooms).forEach(key => {
    const preset = masterRooms[key];
    const people = parseInt(preset.generalPeople, 10) || 0;
    const cap = parseInt(preset.generalCap, 10) || 0;
    const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
    generalTotalPeople += people;
    generalRoomUsed[key] = genRooms;
  });

  const grandTotalPeople = generalTotalPeople + groupTotalPeople;

  const generalTotalRooms = Object.values(generalRoomUsed).reduce((a,b)=>a+b, 0);
  const grandTotalRooms = generalTotalRooms + groupTotalRooms;

  document.getElementById("simStats").innerHTML = `
    <div class="stat">출국 총 인원(예상)<b>${grandTotalPeople}명</b><span>일반 ${generalTotalPeople}명 + 단체 ${groupTotalPeople}명</span></div>
    <div class="stat">출국 단체 인원<b>총 ${groupTotalPeople}명</b><span>신규 ${newTeamsPeople}명(${todayOutTeams.length}개) + 리턴 ${returnTeamsPeople}명(${linkedReturnTeams.length}개)</span></div>
    <div class="stat">객실 사용량(예상)<b>총 ${grandTotalRooms}개</b><span>일반 ${generalTotalRooms}개 + 단체 ${groupTotalRooms}개</span></div>
  `;

  let totalTypeHtml = `<thead><tr>
    <th>객실 종류</th>
    <th>총 사용 객실</th>
    <th>보유 대비</th>
    <th>단체</th>
    <th>일반 여객</th>
  </tr></thead><tbody>`;
  let overLimit = false;

  Object.keys(masterRooms).forEach(key => {
    const preset = masterRooms[key];
    const total = preset.totalRooms;
    const genUsed = generalRoomUsed[key];
    const grpUsed = groupRoomUsed[key];
    const grpPeople = groupPeopleUsed[key];
    const totalUsed = genUsed + grpUsed;
    const genPeople = parseInt(preset.generalPeople, 10) || 0;
    
    let pctStr = "—";
    if(total > 0){
      const pct = (totalUsed / total * 100).toFixed(1);
      pctStr = `<b>${pct}%</b> (${totalUsed}/${total}개)`;
      if(totalUsed > total) overLimit = true;
    }

    const grpDisp = grpPeople > 0 ? `${grpPeople}명 (${grpUsed}개)` : "0개";
    const genDisp = genPeople > 0 ? `${genPeople}명 (${genUsed}개)` : "0개";

    totalTypeHtml += `<tr>
      <td><b>${preset.label}</b></td>
      <td class="${total > 0 && totalUsed > total ? 'bad' : ''}"><b>${totalUsed}개</b></td>
      <td>${pctStr}</td>
      <td>${grpDisp}</td>
      <td>${genDisp}</td>
    </tr>`;
  });
  totalTypeHtml += `</tbody>`;
  document.getElementById("totalTypeTable").innerHTML = totalTypeHtml;

  document.getElementById("simWarn").innerHTML = overLimit ? `<div class="warn-box"><span class="bad">⚠ 초과 경고:</span> 총 출국 객실 신청량이 보유 객실 수를 초과했습니다.</div>` : "";

  let teamResultsHtml = "";
  if (outBoardingTeams.length === 0) {
    teamResultsHtml = `<div style="text-align:center; padding:20px; color:#666;">오늘 출국 승선 예정인 단체가 없습니다.</div>`;
  } else {
    outBoardingTeams.forEach(team => {
      const isReturn = team.isReturnOnTarget;
      const firstDepartDate = isReturn ? team.regDate : selectedDate;
      const firstDepartDow = firstDepartDate ? new Date(firstDepartDate).getDay() : null;
      const isTueThuSunDeparture = (firstDepartDow === 2 || firstDepartDow === 4 || firstDepartDow === 0);
      const teamNameColor = isTueThuSunDeparture ? '#8b0000' : '#1769aa';
      const dowFlag = isTueThuSunDeparture ? '🇨🇳' : (firstDepartDow === 1 || firstDepartDow === 3 || firstDepartDow === 5) ? '🇰🇷' : '';
      let targetAllocations = [];

      if (isReturn) {
        targetAllocations = team.isSplitRoom ? (team.inAllocations || []) : (team.allocations || []);
      } else {
        targetAllocations = team.isSplitRoom ? (team.outAllocations || []) : (team.allocations || []);
      }

      const teamBoardingPeople = targetAllocations.reduce((s, a) => s + (a.people || 0), 0);
      const priceText = team.price ? ` | 💴 ${esc(team.price)}` : '';
      let patternLabel = "🔄 왕복";
      if(team.pattern === 'ONEWAY_OUT') patternLabel = "➡️ 출국 편도";

      const statusTag = isReturn 
        ? `<span class="tag-linked">🔄 리턴 단체</span>`
        : '';
      const ridingTag = team.isRiding ? `<span class="tag-riding">🚴 라이딩</span>` : '';
      let loungeTag = '';
      const loungeTypeForTag = getLoungeType(team.specialNote);
      if (loungeTypeForTag === 'ROUND') loungeTag = `<span class="tag-lounge">🎤 라운지 왕복</span>`;
      else if (loungeTypeForTag === 'ONEWAY') loungeTag = `<span class="tag-lounge">🎤 라운지 편도</span>`;
      else if (loungeTypeForTag === 'RETURN' && isReturn) loungeTag = `<span class="tag-lounge">🎤 라운지 리턴</span>`;
      let restaurantTag = '';
      const restaurantTypeForTag = getRestaurantType(team.specialNote);
      if (restaurantTypeForTag === 'ROUND') restaurantTag = `<span class="tag-restaurant">®️ 식당 왕복</span>`;
      else if (restaurantTypeForTag === 'ONEWAY') restaurantTag = `<span class="tag-restaurant">®️ 식당 편도</span>`;
      else if (restaurantTypeForTag === 'RETURN' && isReturn) restaurantTag = `<span class="tag-restaurant">®️ 식당 리턴</span>`;

      teamResultsHtml += `<div style="margin-bottom:16px; border-bottom:1px solid #e1e7ef; padding-bottom:12px;">
        <h3 style="margin-bottom:4px; color:${teamNameColor};">${dowFlag} ${esc(team.name)} (${teamBoardingPeople}명) <span class="tag-pattern">${patternLabel}</span> ${loungeTag} ${restaurantTag} ${ridingTag} ${statusTag}${priceText}</h3>
        <div style="font-size:13px; font-weight:bold; color:#2e7d32; margin-bottom:6px;">🗓️ 여정 정보: ${team.itineraryStr || (isReturn ? `리턴일: ${formatShortDate(selectedDate)} (원출발: ${formatShortDate(team.regDate)})` : '')}</div>
        ${team.memo ? `<div class="memo-box"><b>✨📌 메모:</b> ${esc(team.memo)}</div>` : ''}`;

      const teamTotalRooms = targetAllocations.reduce((s,a)=>s+(a.roomsNeeded||0), 0);
      
      teamResultsHtml += `<div class="table-responsive">
        <table>
          <thead><tr><th>객실 종류</th><th>인원</th><th>객실 당</th><th>필요 객실 (${teamTotalRooms}실)</th><th>보유 대비 비중</th></tr></thead>
          <tbody>`;
      targetAllocations.forEach(a => {
        const roomHoldPct = a.totalRooms > 0 ? (a.roomsNeeded / a.totalRooms * 100).toFixed(1) + `% (${a.roomsNeeded}/${a.totalRooms}개)` : "—";
        teamResultsHtml += `<tr>
          <td><b>${esc(a.label)}</b></td>
          <td>${a.people}명</td>
          <td>${a.cap}명/실</td>
          <td>${a.roomsNeeded}개</td>
          <td><b>${roomHoldPct}</b></td>
        </tr>`;
      });
      teamResultsHtml += `</tbody></table></div></div>`;
    });
  }

  document.getElementById("teamResultsContainer").innerHTML = teamResultsHtml;
  document.getElementById("simResult").classList.remove("hidden");

  if(shouldSave && db && selectedDate){
    db.collection("schedules").doc(selectedDate).set({
      totalPeople: grandTotalPeople,
      groupTotalPeople: groupTotalPeople,
      teamCount: todayTeams.length,
      masterRooms: masterRooms,
      teams: todayTeams,
      updatedAt: new Date()
    }).then(() => {
      alert(`[${selectedDate}] 일정 정보가 저장되었습니다.`);
      if(calendar) calendar.refetchEvents();
    }).catch(err => { alert("저장 실패: " + err); });
  }
}
